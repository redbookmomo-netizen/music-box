<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="圣咏玫瑰皇家八音盒：基于巴洛克螺钿红丝绒八音盒原画打造的交互式机械八音盒玩具。皇冠与双色鎏金玫瑰随音乐立体旋转，黄铜音筒与28齿银色音梳实时拨弦，哥特彩绘花窗丁达尔圣光与金粉微尘浮动，内置巴赫哥特复调、萨蒂秘境与古典八音盒名曲。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="皇家八音盒" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12070b" />
  <link id="appleTouchIcon" rel="apple-touch-icon" href="" />
  <title>圣咏玫瑰 · 皇家巴洛克八音盒</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0e0508;
      color: #f8ebd2;
      font-family: "Songti SC", "STSong", "Noto Serif SC", "PingFang SC", Georgia, serif;
      touch-action: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    #stageCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #stageCanvas:active {
      cursor: grabbing;
    }
    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        linear-gradient(to bottom, rgba(10, 4, 7, 0.52) 0%, rgba(10, 4, 7, 0.0) 14%, rgba(10, 4, 7, 0.0) 80%, rgba(10, 4, 7, 0.68) 100%),
        radial-gradient(ellipse at 50% 54%, transparent 56%, rgba(8, 3, 6, 0.48) 100%);
    }

    /* 顶部安全区栏（完美避让 iPhone 18 Pro Max 灵动岛） */
    .hud-top {
      position: fixed;
      top: max(12px, calc(env(safe-area-inset-top, 12px) + 6px));
      left: 14px;
      right: 14px;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    body.immersive .hud-top,
    body.immersive .hud-bottom,
    body.immersive .whisper-hint {
      opacity: 0;
      pointer-events: none !important;
      transform: translateY(8px);
    }
    body.immersive .hud-top {
      transform: translateY(-8px);
    }
    .brand-plaque {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(28, 8, 15, 0.52);
      backdrop-filter: blur(16px) saturate(1.35);
      -webkit-backdrop-filter: blur(16px) saturate(1.35);
      border: 1px solid rgba(242, 206, 138, 0.34);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.38);
      color: #f6dfaa;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-shadow: 0 1px 6px rgba(255, 205, 120, 0.45);
      pointer-events: auto;
      cursor: pointer;
    }
    .brand-plaque .gem-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffbfd0, #c81d4e 65%, #58061c);
      box-shadow: 0 0 8px rgba(235, 65, 110, 0.8);
      flex-shrink: 0;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      pointer-events: auto;
    }
    .glass-pill {
      appearance: none;
      border: 1px solid rgba(242, 206, 138, 0.36);
      background: rgba(32, 9, 17, 0.56);
      backdrop-filter: blur(16px) saturate(1.35);
      -webkit-backdrop-filter: blur(16px) saturate(1.35);
      color: #f7e3b5;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.03em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.36);
      transition: transform 0.16s ease, background 0.22s ease, border-color 0.22s ease;
    }
    .glass-pill:active {
      transform: scale(0.93);
    }
    .glass-pill[data-active="true"] {
      background: rgba(98, 22, 44, 0.72);
      border-color: rgba(255, 224, 156, 0.78);
      color: #fff2cf;
    }

    /* 轻声引导提示 */
    .whisper-hint {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 98px);
      transform: translateX(-50%);
      z-index: 5;
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(26, 7, 14, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(242, 206, 138, 0.32);
      color: #fcebc4;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .whisper-hint.hidden {
      opacity: 0;
      transform: translate(-50%, 8px);
    }

    /* 底部拇指播放坞 */
    .hud-bottom {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(12px, calc(env(safe-area-inset-bottom, 10px) + 8px));
      max-width: 520px;
      margin: 0 auto;
      z-index: 6;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .player-dock {
      position: relative;
      overflow: hidden;
      padding: 10px 12px 12px 16px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(44, 11, 22, 0.74), rgba(22, 6, 12, 0.82));
      backdrop-filter: blur(20px) saturate(1.45);
      -webkit-backdrop-filter: blur(20px) saturate(1.45);
      border: 1px solid rgba(244, 208, 138, 0.38);
      box-shadow:
        0 14px 38px rgba(0, 0, 0, 0.58),
        0 1px 0 rgba(255, 240, 200, 0.18) inset;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .track-meta {
      flex: 1;
      min-width: 0;
      cursor: pointer;
      padding-right: 4px;
    }
    .track-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .track-tag {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #ffe9b6;
      background: rgba(168, 38, 72, 0.55);
      border: 1px solid rgba(246, 208, 140, 0.35);
    }
    .spring-meter {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 10.5px;
      color: rgba(246, 226, 186, 0.68);
      letter-spacing: 0.02em;
    }
    #trackTitle {
      font-size: 15.5px;
      font-weight: 600;
      color: #fff2d4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.02em;
    }
    #trackComposer {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", Georgia, serif;
      font-size: 11.5px;
      font-style: italic;
      color: rgba(246, 226, 188, 0.68);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dock-controls {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .ctrl-btn {
      appearance: none;
      background: none;
      border: 0;
      color: #f5dba0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.14s ease, background 0.2s ease;
    }
    .ctrl-btn:active {
      transform: scale(0.9);
      background: rgba(255, 225, 160, 0.12);
    }
    #playBtn {
      width: 46px;
      height: 46px;
      font-size: 18px;
      color: #380b15;
      background: radial-gradient(circle at 32% 28%, #fff6cf 0%, #f3cb70 45%, #bf8424 100%);
      box-shadow:
        0 0 18px rgba(255, 204, 108, 0.52),
        0 2px 6px rgba(0, 0, 0, 0.42),
        0 1px 1px rgba(255, 255, 255, 0.65) inset;
    }
    .progress-track {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 0;
      height: 2.5px;
      background: rgba(255, 232, 185, 0.12);
      overflow: hidden;
      pointer-events: none;
    }
    #progressFill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #e5ad46, #fff0ba, #f29ab8);
      box-shadow: 0 0 8px rgba(255, 224, 150, 0.75);
      transition: width 0.12s linear;
    }

    /* 弹出抽屉公共样式（曲目单 & 调光音面板） */
    .drawer-sheet {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: max(92px, calc(env(safe-area-inset-bottom, 10px) + 86px));
      max-width: 520px;
      margin: 0 auto;
      z-index: 7;
      border-radius: 22px;
      background: linear-gradient(160deg, rgba(38, 10, 20, 0.90), rgba(18, 5, 10, 0.94));
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      border: 1px solid rgba(244, 208, 138, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.68);
      color: #faecd2;
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px) scale(0.98);
      transition: opacity 0.25s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .drawer-sheet.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    /* 曲目单抽屉 */
    #playlistSheet {
      padding: 12px;
      max-height: min(62dvh, 490px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      appearance: none;
      border: 1px solid rgba(242, 206, 138, 0.28);
      background: rgba(255, 235, 190, 0.06);
      color: rgba(250, 234, 202, 0.8);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-tab.active {
      background: linear-gradient(135deg, rgba(186, 52, 86, 0.68), rgba(128, 28, 54, 0.78));
      border-color: rgba(255, 224, 154, 0.72);
      color: #fff5dc;
      font-weight: 600;
    }
    .song-list-scroll {
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 2px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .song-item {
      padding: 10px 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.16s ease;
    }
    .song-item:active {
      background: rgba(244, 208, 138, 0.14);
    }
    .song-item.active {
      background: rgba(244, 204, 124, 0.16);
      border-color: rgba(244, 208, 138, 0.36);
    }
    .song-item-left {
      min-width: 0;
      flex: 1;
    }
    .song-item-title {
      font-size: 14.5px;
      color: #fff2d6;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-item-sub {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 11.5px;
      color: rgba(246, 224, 186, 0.62);
      margin-top: 2px;
    }
    .song-item-badge {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(244, 208, 138, 0.12);
      color: #f6d998;
      border: 1px solid rgba(244, 208, 138, 0.24);
      flex-shrink: 0;
    }

    /* 调光音抽屉 */
    #tuningSheet {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: #fce7ba;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(244, 208, 138, 0.18);
    }
    .view-mode-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .mode-btn {
      appearance: none;
      border: 1px solid rgba(244, 208, 138, 0.28);
      background: rgba(255, 236, 195, 0.06);
      color: rgba(252, 236, 206, 0.85);
      border-radius: 11px;
      padding: 7px 6px;
      font-size: 11.5px;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: rgba(176, 46, 80, 0.62);
      border-color: rgba(255, 224, 154, 0.76);
      color: #fff6df;
      font-weight: 600;
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(252, 236, 206, 0.9);
    }
    .slider-val {
      font-variant-numeric: tabular-nums;
      color: #f6d58e;
      font-weight: 600;
    }
    input[type="range"] {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      accent-color: #f0c264;
      cursor: pointer;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      padding-top: 2px;
      color: rgba(252, 236, 206, 0.88);
    }
    .switch-pill {
      appearance: none;
      border: 1px solid rgba(244, 208, 138, 0.35);
      background: rgba(255, 236, 195, 0.08);
      color: #f9e4b7;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      cursor: pointer;
    }
    .switch-pill.on {
      background: rgba(212, 156, 54, 0.35);
      border-color: #f8d584;
      color: #fff7e0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">圣咏玫瑰 · 皇家巴洛克机械八音盒交互玩具</h1>
  <canvas id="stageCanvas" aria-label="巴洛克皇冠玫瑰八音盒与哥特彩绘花窗光影画布"></canvas>
  <div class="vignette-overlay"></div>

  <header class="hud-top" id="hudTop">
    <div class="brand-plaque" id="zoomQuickBtn" title="轻触切换全景与机芯特写">
      <span class="gem-dot"></span>
      <span>圣咏玫瑰八音盒</span>
    </div>
    <div class="top-actions">
      <button class="glass-pill" id="windBtn" type="button" aria-label="给八音盒上发条">🔑 上发条</button>
      <button class="glass-pill" id="tuneBtn" type="button" aria-label="调节光影与八音盒音色">✨ 调光音</button>
    </div>
  </header>

  <div class="whisper-hint" id="whisperHint">轻触八音盒奏响 · 指尖左右拨动皇冠玫瑰可亲手转音</div>

  <!-- 曲目单抽屉 -->
  <section class="drawer-sheet" id="playlistSheet" aria-label="八音盒曲目单">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-cat="all" type="button">全部名曲 (12)</button>
      <button class="filter-tab" data-cat="bach" type="button">哥特与复调巴赫 (4)</button>
      <button class="filter-tab" data-cat="satie" type="button">萨蒂空灵秘境 (2)</button>
      <button class="filter-tab" data-cat="classic" type="button">古典八音盒 (6)</button>
    </div>
    <div class="song-list-scroll" id="songListScroll"></div>
  </section>

  <!-- 调光音抽屉 -->
  <section class="drawer-sheet" id="tuningSheet" aria-label="光影与声学调校">
    <div class="sheet-header">
      <span>✦ 镜头视野与八音盒声学</span>
      <span style="font-size:11px;opacity:0.68;font-weight:400;">双击画面可隐藏界面</span>
    </div>
    <div class="view-mode-group" id="viewModeGroup">
      <button class="mode-btn active" data-view="auto" type="button">📱 哥特全景</button>
      <button class="mode-btn" data-view="closeup" type="button">🔍 机芯特写</button>
      <button class="mode-btn" data-view="original" type="button">🖼️ 原画横幅</button>
    </div>
    <div class="slider-row">
      <div class="slider-label">
        <span>圣堂空灵混响 · Reverb</span>
        <span class="slider-val" id="reverbVal">46%</span>
      </div>
      <input id="reverbSlider" type="range" min="10" max="90" value="46" />
    </div>
    <div class="slider-row">
      <div class="slider-label">
        <span>彩绘圣光与金粉粒子 · Light &amp; Dust</span>
        <span class="slider-val" id="lightVal">115%</span>
      </div>
      <input id="lightSlider" type="range" min="30" max="180" value="115" />
    </div>
    <div class="slider-row">
      <div class="slider-label">
        <span>发条演奏转速 · Tempo</span>
        <span class="slider-val" id="tempoVal">1.00×</span>
      </div>
      <input id="tempoSlider" type="range" min="72" max="132" value="100" />
    </div>
    <div class="toggle-row">
      <span>真实发条余韵（随发条渐慢停驻）</span>
      <button class="switch-pill" id="springModeBtn" type="button">自动续弦</button>
    </div>
  </section>

  <!-- 底部播放器 -->
  <footer class="hud-bottom" id="hudBottom">
    <div class="player-dock">
      <div class="track-meta" id="trackMetaBtn" title="点击展开曲目单">
        <div class="track-badge-row">
          <span class="track-tag" id="trackTag">哥特巴赫</span>
          <span class="spring-meter" id="springReadout">发条满弦 · 轻触拨玩</span>
        </div>
        <div id="trackTitle">D小调托卡塔与赋格 (哥特圣咏)</div>
        <div id="trackComposer">J.S. Bach · BWV 565</div>
      </div>
      <div class="dock-controls">
        <button class="ctrl-btn" id="prevBtn" type="button" aria-label="上一曲">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2.2v12H6V6zm3.8 6 8.7 6V6l-8.7 6z"/></svg>
        </button>
        <button class="ctrl-btn" id="playBtn" type="button" aria-label="播放或暂停">
          <svg id="playIconSvg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6L19.2 12 8 5.2z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" type="button" aria-label="下一曲">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.8 6H18v12h-2.2V6zM6.5 18l8.7-6-8.7-6v12z"/></svg>
        </button>
        <button class="ctrl-btn" id="listBtn" type="button" aria-label="曲目列表">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h12"/></svg>
        </button>
      </div>
      <div class="progress-track"><div id="progressFill"></div></div>
    </div>
  </footer>

<script>
(() => {

  /* =========================================================================
   * 2. 十二首精编古典八音盒曲库（哥特复调巴赫 + 萨蒂秘境 + 经典钢片琴八音盒名作）
   * ========================================================================= */
  const NOTE_INDEX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function noteToMidi(s) {
    const m = /^([A-G])([#b]?)([2-7])$/.exec(s);
    return 12 * (+m[3] + 1) + NOTE_INDEX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  }
  function parseVoice(str, tr = 0, vel = 1) {
    let tt = 0;
    const ev = [];
    for (const tok of str.trim().split(/\s+/)) {
      if (!tok) continue;
      const [nPart, dPart] = tok.split(':');
      const du = dPart ? parseFloat(dPart) : 1;
      if (nPart !== 'R') {
        ev.push({ t: tt, m: nPart.split('+').map(q => noteToMidi(q) + tr), v: vel });
      }
      tt += du;
    }
    return { ev, len: tt };
  }

          'R:8 A2:1 E3:1 A3:1 R:3 E2:1 E3:1 G#3:1 R:3 A2+E3+A3:6 R:2'
        ].join(' ')
      ]
    },
    {
      id: 'brahms-lullaby',
      cat: 'classic',
      tag: '星夜哄睡',
      n: '勃拉姆斯摇篮曲',
      c: 'Brahms · Wiegenlied, Op.49',
      u: 0.27,
      tr: 12,
      v: [
        [
          'E4:1 E4:1 G4:4 E4:1 E4:1 G4:4 E4:1 G4:1 C5:2 B4:3 A4:1 A4:2 G4:2',
          'D4:1 E4:1 F4:2 D4:2 D4:1 E4:1 F4:4 D4:1 F4:1 B4:1 A4:1 G4:2 B4:2 C5:4',
          'C4:1 C4:1 C5:4 A4:1 F4:1 G4:4 E4:1 C4:1 F4:2 G4:2 A4:2 G4:4',
          'C4:1 C4:1 C5:4 A4:1 F4:1 G4:4 E4:1 C4:1 F4:2 E4:2 D4:2 C4:6 R:2'
        ].join(' '),
        [
          'R:2 C3+G3:6 C3+G3:6 C3+E3:6 F3+C4:4',
          'R:2 G3+B3:6 G3+D4:6 G3+F3:6 C3+E3:4',
          'R:2 F3+A3:6 C3+G3:6 F3+A3:6 C3+E3:4',
          'R:2 F3+A3:6 C3+E3:6 G3+B3:6 C3+G3+E4:6 R:2'
        ].join(' ')
      ]
    }
  ];

  SONGS.forEach(so => {
    const parts = so.v.map((s, idx) => {
      const lp = s[0] === '*';
      return { lp, ...parseVoice(lp ? s.slice(1) : s, so.tr || 0, idx === 0 ? 1.0 : 0.76) };
    });
    so.len = Math.max(...parts.filter(p => !p.lp).map(p => p.len));
    const events = [];
    parts.forEach(p => {
      if (p.lp) {
        for (let off = 0; off < so.len; off += p.len) {
          p.ev.forEach(e => {
            if (off + e.t < so.len) events.push({ ...e, t: off + e.t });
          });
        }
      } else {
        events.push(...p.ev);
      }
    });
    so.ev = events.sort((a, b) => a.t - b.t);
  });

  /* =========================================================================
   * 3. 瑞士古董机械八音盒物理声学引擎 (悬臂钢片非谐泛音 + 黄铜拨针瞬态 + 木盒圣堂共鸣)
   * ========================================================================= */
  let AC = null;
  let masterGain = null;
  let dryGain = null;
  let wetGain = null;
  let bodyInput = null;
  let songBus = null;
  let clickBuffer = null;
  let reverbAmount = 0.46;

  // 悬臂钢片音梳非谐波泛音列: [频率比, 幅度权重, 衰减时长系数]
  const TINE_PARTIALS = [
    [1.000, 1.00, 1.00],
    [2.002, 0.17, 0.44],
    [3.986, 0.11, 0.21],
    [6.268, 0.055, 0.09],
    [9.120, 0.024, 0.04]
  ];

  function ensureAudio() {
    if (AC) {
      if (AC.state === 'suspended') AC.resume().catch(() => {});
      return;
    }
    try {
      // 让 iPhone 18 Pro Max 即使开启侧边静音模式也能正常外放音乐盒声音
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (_) {}

    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    AC = new Ctx();

    // 预生成 8ms 黄铜音钉拨动钢片尖端的清脆金属瞬态微噪脉冲
    const clickLen = Math.max(64, Math.floor(AC.sampleRate * 0.008));
    clickBuffer = AC.createBuffer(1, clickLen, AC.sampleRate);
    const cd = clickBuffer.getChannelData(0);
    for (let i = 0; i < clickLen; i++) {
      const env = Math.pow(1 - i / clickLen, 2.8);
      cd[i] = (Math.random() * 2 - 1) * env;
    }

    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -15;
    comp.knee.value = 18;
    comp.ratio.value = 3.5;
    comp.attack.value = 0.003;
    comp.release.value = 0.18;
    comp.connect(AC.destination);

    masterGain = AC.createGain();
    masterGain.gain.value = 0.92;
    masterGain.connect(comp);

    // 玫瑰木螺钿盒体三段共鸣腔滤波 (温暖木腔 + 面板光泽 + 空气丝绒感)
    const boxLow = AC.createBiquadFilter();
    boxLow.type = 'peaking';
    boxLow.frequency.value = 370;
    boxLow.Q.value = 1.4;
    boxLow.gain.value = 3.2;

    const boxMid = AC.createBiquadFilter();
    boxMid.type = 'peaking';
    boxMid.frequency.value = 1240;
    boxMid.Q.value = 1.8;
    boxMid.gain.value = 2.6;

    const boxAir = AC.createBiquadFilter();
    boxAir.type = 'highshelf';
    boxAir.frequency.value = 4800;
    boxAir.gain.value = 2.0;

    boxLow.connect(boxMid);
    boxMid.connect(boxAir);
    bodyInput = boxLow;

    // 立体声早期木盒反射 + 哥特石拱教堂阻尼混响冲激响应
    const irLen = Math.floor(AC.sampleRate * 3.1);
    const irBuf = AC.createBuffer(2, irLen, AC.sampleRate);
    const earlyTaps = [
      [0.011, 0.36], [0.019, -0.28], [0.029, 0.22], [0.043, -0.17], [0.067, 0.13]
    ];
    for (let ch = 0; ch < 2; ch++) {
      const d = irBuf.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < irLen; i++) {
        const u = i / irLen;
        const decay = Math.pow(1 - u, 3.15) * (0.82 + 0.18 * Math.exp(-u * 14));
        const raw = (Math.random() * 2 - 1) * decay;
        // 随时间推移高频柔和吸收，模拟丝绒与石壁声学温润度
        const damp = 0.28 + 0.55 * (1 - u);
        lp += (raw - lp) * damp;
        d[i] = lp;
      }
      earlyTaps.forEach(([sec, amp], idx) => {
        const sIdx = Math.floor((sec + ch * 0.0023 * (idx + 1)) * AC.sampleRate);
        if (sIdx < irLen) d[sIdx] += amp;
      });
    }

    const convolver = AC.createConvolver();
    convolver.buffer = irBuf;

    dryGain = AC.createGain();
    wetGain = AC.createGain();
    updateReverbMix();

    boxAir.connect(dryGain);
    dryGain.connect(masterGain);
    boxAir.connect(convolver);
    convolver.connect(wetGain);
    wetGain.connect(masterGain);

    resetSongBus();
  }

  function updateReverbMix() {
    if (!dryGain || !wetGain) return;
    dryGain.gain.value = 0.94 - reverbAmount * 0.22;
    wetGain.gain.value = reverbAmount * 0.72;
  }

  function resetSongBus() {
    if (!AC || !bodyInput) return;
    if (songBus) {
      const old = songBus;
      old.gain.setTargetAtTime(0.0001, AC.currentTime, 0.09);
      setTimeout(() => { try { old.disconnect(); } catch (_) {} }, 900);
    }
    songBus = AC.createGain();
    songBus.gain.value = 1.0;
    songBus.connect(bodyInput);
  }

  function pluckNote(midi, when, vel = 1.0) {
    if (!AC || !songBus) return;
    // 将超低音温和折叠至八音盒音梳可清晰共鸣的音区，同时保留低音浑厚根音感
    const m = midi < 43 ? midi + 12 : midi;
    const freq = 440 * Math.pow(2, (m - 69) / 12);
    const sustainScale = Math.min(2.7, Math.max(0.56, Math.sqrt(560 / freq) * 1.65));

    // 按音梳齿左右位置赋予自然微立体声声像 (-0.28 .. +0.28)
    let targetNode = songBus;
    if (AC.createStereoPanner) {
      const pan = AC.createStereoPanner();
      pan.pan.value = Math.max(-0.3, Math.min(0.3, ((m - 62) / 28) * 0.28));
      pan.connect(songBus);
      targetNode = pan;
    }

    // 1) 黄铜音钉滑脱钢片尖端的 4ms 金属晶莹瞬态 "Ping"
    if (clickBuffer) {
      const src = AC.createBufferSource();
      src.buffer = clickBuffer;
      const bp = AC.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = Math.min(8200, Math.max(2400, freq * 4.8));
      bp.Q.value = 4.6;
      const cg = AC.createGain();
      cg.gain.setValueAtTime(0.052 * vel, when);
      cg.gain.exponentialRampToValueAtTime(0.0001, when + 0.011);
      src.connect(bp);
      bp.connect(cg);
      cg.connect(targetNode);
      src.start(when);
    }

    // 2) 悬臂钢片非谐波泛音叠加 + 拨弦瞬间微音高回落包络
    const bassBoost = m < 56 ? 1.24 : 1.0;
    for (let i = 0; i < TINE_PARTIALS.length; i++) {
      const [ratio, amp, dec] = TINE_PARTIALS[i];
      const pf = freq * ratio;
      if (pf > 15500) continue;
      const osc = AC.createOscillator();
      const g = AC.createGain();
      osc.type = (i === 0 && m < 54) ? 'triangle' : 'sine';
      const endT = when + dec * sustainScale * 1.72 + 0.05;

      if (i === 0) {
        osc.frequency.setValueAtTime(pf * 1.008, when);
        osc.frequency.exponentialRampToValueAtTime(pf, when + 0.0045);
      } else {
        osc.frequency.setValueAtTime(pf, when);
      }
      osc.detune.value = (Math.random() - 0.5) * 5.5;

      const peak = amp * vel * 0.145 * (i === 0 ? bassBoost : 1.0);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime(peak, when + 0.0018);
      g.gain.exponentialRampToValueAtTime(0.0001, endT);

      osc.connect(g);
      g.connect(targetNode);
      osc.start(when);
      osc.stop(endT + 0.04);
    }
  }

  // 上发条黄铜棘轮清脆咔哒声
  function playRatchetClick(pitchMul = 1.0) {
    ensureAudio();
    if (!AC || !clickBuffer) return;
    const now = AC.currentTime;
    for (let k = 0; k < 2; k++) {
      const t0 = now + k * 0.045;
      const osc = AC.createOscillator();
      const g = AC.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime((1650 + k * 280) * pitchMul, t0);
      osc.frequency.exponentialRampToValueAtTime(620 * pitchMul, t0 + 0.022);
      g.gain.setValueAtTime(0.065, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.024);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(t0);
      osc.stop(t0 + 0.03);
    }
  }

  /* =========================================================================
   * 4. 播放调度、发条动力学与状态管理
   * ========================================================================= */
  let curSongIdx = 0;
  let playing = false;
  let songBeatPos = 0;
  let eventPtr = 0;
  let lastSchedAudioTime = 0;
  let tempoUser = 1.0;
  let realisticSpringMode = false;
  let springEnergy = 1.0; // 0..1 发条储能
  const visualNoteQueue = [];

  function effectiveRate() {
    const springFactor = realisticSpringMode
      ? Math.max(0.42, 0.55 + 0.45 * Math.pow(springEnergy, 0.45))
      : 1.0;
    return tempoUser * springFactor;
  }

  function scheduleNotes() {
    if (!playing || !AC) return;
    if (realisticSpringMode && springEnergy <= 0.005) {
      pausePlayback();
      updateUI();
      return;
    }
    const now = AC.currentTime;
    const dtAudio = Math.min(0.15, Math.max(0, now - lastSchedAudioTime));
    lastSchedAudioTime = now;

    const so = SONGS[curSongIdx];
    const rate = effectiveRate();
    const beatDur = so.u / rate;
    songBeatPos += dtAudio / beatDur;

    // 预调度未来 0.22s 内的音符事件
    const lookaheadBeats = 0.22 / beatDur;
    while (true) {
      if (eventPtr >= so.ev.length) {
        songBeatPos -= (so.len + 2.5);
        eventPtr = 0;
        if (songBeatPos < -3) songBeatPos = 0;
      }
      const ev = so.ev[eventPtr];
      const deltaBeats = ev.t - songBeatPos;
      if (deltaBeats > lookaheadBeats) break;

      if (deltaBeats >= -0.35) {
        const playTime = Math.max(now + 0.005, now + deltaBeats * beatDur);
        const sortedNotes = [...ev.m].sort((a, b) => a - b);
        const chordVel = ev.v * (sortedNotes.length > 2 ? 0.76 : 1.0);
        // 真实黄铜音筒和弦微琶音错位 (13ms 级联绽放)
        sortedNotes.forEach((mNote, idx) => {
          pluckNote(mNote, playTime + idx * 0.013, chordVel);
        });
        visualNoteQueue.push({ w: playTime, m: sortedNotes });
      }
      eventPtr++;
    }
  }
  setInterval(scheduleNotes, 42);

  function startPlayback() {
    ensureAudio();
    if (!AC) return;
    if (realisticSpringMode && springEnergy < 0.08) springEnergy = 1.0;
    if (!songBus) resetSongBus();
    lastSchedAudioTime = AC.currentTime;
    playing = true;
    document.getElementById('whisperHint').classList.add('hidden');
    updateUI();
  }

  function pausePlayback() {
    playing = false;
    visualNoteQueue.length = 0;
    if (AC) resetSongBus();
    updateUI();
  }

  function selectSong(idx) {
    curSongIdx = (idx + SONGS.length) % SONGS.length;
    songBeatPos = 0;
    eventPtr = 0;
    visualNoteQueue.length = 0;
    if (AC) resetSongBus();
    startPlayback();
  }

  function windUpSpring() {
    springEnergy = Math.min(1.0, springEnergy + 0.45);
    playRatchetClick(0.95 + springEnergy * 0.2);
    spinBoost += 1.35;
    spawnSparklesScene(524, OY + 235, 10);
    if (!playing) startPlayback();
    updateUI();
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && AC && playing) {
      AC.resume().catch(() => {});
      lastSchedAudioTime = AC.currentTime;
    }
  });

  /* =========================================================================
   * 5. 图像资源加载与前景遮罩层预烘焙
   * ========================================================================= */
  const imgs = {};
  let assetsReady = false;
  const fgRimCanvas = document.createElement('canvas');
  fgRimCanvas.width = 560;
  fgRimCanvas.height = 110;
  const fgX0 = 340;
  const fgY0 = OY + 358; // 1108

  // 音筒表面预生成 110 颗黄铜音钉分布
  const CYL_PINS = Array.from({ length: 110 }, (_, i) => ({
    u: ((i * 0.6180339887) % 1) * 0.94 + 0.03,
    ang: (i * 2.399963) % TAU
  }));

  function bakeForegroundRim() {
    const c = fgRimCanvas.getContext('2d');
    c.clearRect(0, 0, fgRimCanvas.width, fgRimCanvas.height);
    c.save();
    c.beginPath();
    // 沿原画八音盒前壁内沿与正面珍珠红宝石冠饰上沿精确裁剪，使音梳根部与转盘底影自然藏在盒内
    const pts = [
      [352, OY + 368], [438, OY + 381], [476, OY + 385],
      [490, OY + 374], [508, OY + 369], [526, OY + 374],
      [542, OY + 387], [662, OY + 401], [794, OY + 415],
      [836, OY + 416], [885, OY + 376], [885, OY + 462], [352, OY + 462]
    ];
    pts.forEach(([px, py], idx) => {
      if (idx === 0) c.moveTo(px - fgX0, py - fgY0);
      else c.lineTo(px - fgX0, py - fgY0);
    });
    c.closePath();
    c.clip();
    c.drawImage(
      imgs.master,
      fgX0, fgY0, fgRimCanvas.width, fgRimCanvas.height,
      0, 0, fgRimCanvas.width, fgRimCanvas.height
    );
    c.restore();
  }

  function setupAppleTouchIcon() {
    try {
      const ic = document.createElement('canvas');
      ic.width = ic.height = 180;
      const ix = ic.getContext('2d');
      // 截取八音盒主体区域生成精美桌面图标
      ix.drawImage(imgs.master, 260, OY + 10, 680, 680, 0, 0, 180, 180);
      const link = document.getElementById('appleTouchIcon');
      if (link) link.href = ic.toDataURL('image/png');
    } catch (_) {}
  }

  Promise.all(
    Object.entries(ASSETS).map(([k, src]) => new Promise(resolve => {
      const im = new Image();
      im.onload = () => { imgs[k] = im; resolve(); };
      im.onerror = () => resolve();
      im.src = src;
    }))
  ).then(() => {
    if (imgs.master) {
      bakeForegroundRim();
      setupAppleTouchIcon();
      assetsReady = true;
    }
  });

  /* =========================================================================
   * 6. 视口自适应相机系统 (完美适配 iPhone 18 Pro Max 竖屏全景 / 机芯特写 / 原画横幅)
   * ========================================================================= */
  const cv = document.getElementById('stageCanvas');
  const ctx = cv.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;
  let DPR = Math.min(window.devicePixelRatio || 1, 3);

  let viewMode = 'auto'; // 'auto' | 'closeup' | 'original'
  const cam = { sc: 1, ox: 0, oy: 0 };
  const camTarget = { sc: 1, ox: 0, oy: 0 };

  function updateCameraTarget(immediate = false) {
    if (viewMode === 'closeup') {
      // 机芯与旋转皇冠玫瑰近景特写（居中聚焦皇冠、玫瑰、宝镜倒影与黄铜音梳）
      const focusW = W < H ? 470 : 590;
      const focusH = W < H ? 620 : 410;
      const sc = Math.min(W / focusW, H / focusH);
      const cx = 618;
      const cy = OY + 278;
      camTarget.sc = sc;
      camTarget.ox = W * 0.5 - cx * sc;
      camTarget.oy = H * 0.48 - cy * sc;
    } else if (viewMode === 'original' || (viewMode === 'auto' && W > H * 0.96)) {
      // 原图 3:2 经典横幅视野 (1024 x 682 at y = OY..OY+682)
      const scContain = Math.min(W / 1024, H / 682);
      const scCover = Math.max(W / 1024, H / 682);
      // 横屏适度填满但绝不裁切皇冠与正面玫瑰浮雕；竖屏若强制原图模式则完整展示原画横幅
      const sc = W > H ? Math.min(scCover, H / 625) : scContain * 0.98;
      camTarget.sc = sc;
      camTarget.ox = W * 0.5 - 512 * sc;
      camTarget.oy = H * 0.49 - (OY + 336) * sc;
    } else {
      // iPhone 18 Pro Max 竖屏哥特大教堂全景：上下满屏无黑边，同时完整保留左侧玫瑰花窗(x=72..355)与八音盒主体(x=278..942)
      const safeSceneW = 876;
      const scW = W / safeSceneW;
      const scH = H / SH_SCENE;
      const finalSc = Math.max(scW, Math.min(scH, W / 845));
      camTarget.sc = finalSc;
      camTarget.ox = W * 0.5 - 506 * finalSc;
      if (SH_SCENE * finalSc >= H) {
        const rawOy = H * 0.55 - (OY + 300) * finalSc;
        camTarget.oy = Math.max(H - SH_SCENE * finalSc, Math.min(0, rawOy));
      } else {
        camTarget.oy = (H - SH_SCENE * finalSc) * 0.5;
      }
    }

    if (immediate) {
      cam.sc = camTarget.sc;
      cam.ox = camTarget.ox;
      cam.oy = camTarget.oy;
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    updateCameraTarget(true);
  }
  window.addEventListener('resize', resize);

  function screenToScene(px, py) {
    return {
      x: (px - cam.ox) / cam.sc,
      y: (py - cam.oy) / cam.sc
    };
  }

  /* =========================================================================
   * 7. 圣堂体积光束、悬浮金粉微尘与星芒粒子系统
   * ========================================================================= */
  let lightIntensity = 1.15;

  // 顶部玫瑰花窗圣光束 + 左侧主彩绘花窗丁达尔光束 (全部定义在 1024x1835 场景空间)
  const SUNBEAMS = [
    // 上层哥特玫瑰花窗斜射金光
    { x0: 195, y0: 45,  y1: 680, slope: 1.16, w0: 36, w1: 115, col: [255, 224, 162], alpha: 0.10, ph: 0.4 },
    { x0: 248, y0: 95,  y1: 760, slope: 1.12, w0: 48, w1: 145, col: [255, 206, 152], alpha: 0.09, ph: 2.1 },
    // 左侧主玫瑰花窗与柳叶花窗多色彩绘丁达尔光束 (精准穿过皇冠与螺钿盒身)
    { x0: 145, y0: 585, y1: 1380, slope: 0.90, w0: 42, w1: 148, col: [255, 226, 170], alpha: 0.105, ph: 1.1 },
    { x0: 175, y0: 710, y1: 1460, slope: 0.93, w0: 52, w1: 165, col: [255, 176, 208], alpha: 0.085, ph: 3.3 },
    { x0: 135, y0: 825, y1: 1560, slope: 0.88, w0: 46, w1: 155, col: [195, 175, 255], alpha: 0.075, ph: 4.7 },
    { x0: 295, y0: 760, y1: 1390, slope: 0.95, w0: 32, w1: 120, col: [255, 232, 182], alpha: 0.090, ph: 5.8 },
    { x0: 115, y0: 940, y1: 1680, slope: 0.84, w0: 40, w1: 145, col: [165, 214, 255], alpha: 0.068, ph: 2.6 }
  ];

  // 三层景深大教堂悬浮金粉微尘 (远景微粒、中景金尘、近景柔焦光斑)
  const DUST_MOTES = Array.from({ length: 175 }, (_, i) => {
    const layer = i < 95 ? 0 : (i < 150 ? 1 : 2);
    return {
      x: Math.random() * SW_SCENE,
      y: Math.random() * SH_SCENE,
      r: layer === 0 ? (0.9 + Math.random() * 1.3) : (layer === 1 ? (1.8 + Math.random() * 2.1) : (4.2 + Math.random() * 4.5)),
      vy: (0.14 + Math.random() * 0.28) * (1 + layer * 0.35),
      vx: (Math.random() - 0.5) * 0.18,
      layer,
      ph: Math.random() * TAU,
      hue: ['#fff1cc', '#ffd9e8', '#ffe49e', '#dcebff'][i % 4]
    };
  });

  // 八音盒宝石固定星芒闪烁点 (场景坐标)
  const JEWEL_GLINTS = [
    { x: 735, y: OY + 38,  s: 11, ph: 0.3, col: '#ffd8e6' }, // 盒盖顶部红宝石
    { x: 735, y: OY + 18,  s: 9,  ph: 1.9, col: '#fff8e6' }, // 盒盖顶珠
    { x: 508, y: OY + 380, s: 9,  ph: 2.8, col: '#fff5dc' }, // 前沿主珍珠
    { x: 495, y: OY + 518, s: 8,  ph: 4.1, col: '#ffc8dc' }, // 正面下方红宝石
    { x: 312, y: OY + 412, s: 7,  ph: 5.2, col: '#e6f4ff' }, // 左侧螺钿珍珠链
    { x: 758, y: OY + 455, s: 8,  ph: 3.6, col: '#ffe8f6' }  // 右侧螺钿珍珠链
  ];

  const sparkles = [];
  function spawnSparklesScene(sx, sy, count = 3) {
    for (let i = 0; i < count; i++) {
      const ang = -Math.PI * 0.5 + (Math.random() - 0.5) * 2.2;
      const spd = 18 + Math.random() * 52;
      sparkles.push({
        x: sx + (Math.random() - 0.5) * 8,
        y: sy + (Math.random() - 0.5) * 6,
        vx: Math.cos(ang) * spd,

        life: 1.0,
        decay: 0.52 + Math.random() * 0.38,
        size: 3.2 + Math.random() * 4.8,
        col: ['#fff5cc', '#ffd4e5', '#ffe18c', '#d9ecff'][(Math.random() * 4) | 0]
      });

    if (sparkles.length > 220) sparkles.splice(0, sparkles.length - 220);
