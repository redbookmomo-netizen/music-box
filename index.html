<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#120a10;overflow:hidden;font-family:"Songti SC","Noto Serif SC","Times New Roman",serif;color:#f6e7c8}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 50%,rgba(0,0,0,.6))}
#top{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;text-align:center;pointer-events:none;letter-spacing:.35em;font-size:15px;color:#f3d99a;text-shadow:0 0 12px rgba(255,200,120,.7)}
#bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:520px;margin:auto;padding:10px 12px 10px 18px;border-radius:24px;background:rgba(40,12,22,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(240,200,120,.35);display:flex;align-items:center;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#info{flex:1;min-width:0}#nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#cp{font-size:12px;opacity:.65;margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{background:none;border:0;color:#f3d99a;font-size:19px;width:44px;height:44px;border-radius:50%;font-family:inherit}
#play{background:linear-gradient(#fbe7a6,#c8902c);color:#3a1018;box-shadow:0 0 16px rgba(255,200,100,.5)}
#list{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 86px);max-width:520px;margin:auto;border-radius:20px;background:rgba(30,10,18,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(240,200,120,.35);padding:8px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.3s;max-height:60vh;overflow:auto}
#list.on{transform:none;opacity:1;pointer-events:auto}
.it{padding:12px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.it small{opacity:.55;font-style:italic;font-size:12px;text-align:right}.it.cur{background:rgba(240,200,120,.16);color:#ffe3a0}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 96px);text-align:center;font-size:14px;letter-spacing:.25em;color:#ffe9b8;text-shadow:0 0 10px #000;pointer-events:none;transition:opacity 1.2s}
</style></head><body>
<canvas id="c"></canvas><div id="vig"></div>
<div id="top">✦ 公主的八音盒 ✦</div>
<div id="hint">轻触八音盒 · 上弦</div>
<div id="list"></div>
<div id="bar"><div id="info"><div id="nm"></div><div id="cp"></div></div>
<button id="prev">&#x23EE;&#xFE0E;</button><button id="play">&#x25B6;&#xFE0E;</button><button id="next">&#x23ED;&#xFE0E;</button><button id="lb">☰</button></div>
<script>
const $=i=>document.getElementById(i),cv=$('c');let x=cv.getContext('2d');const MX=x;
const TAU=Math.PI*2,GL=['#2a55e0','#d4204e','#8a3ee0','#1fa877','#f0b830','#40b0f0','#e05aa0'];
let W,H,D,L,beams=[],dust=[],spk=[],teeth=new Array(24).fill(0),t=0,last=performance.now(),ang=0,spd=0,cyl=0,pulse=0,bob=0;
const sc=document.createElement('canvas');
/* ---------- songs (public domain) ---------- */
const B1='D3:4 A3:4 B3:4 F#3:4 G3:4 D3:4 G3:4 A3:4';
const PR='C4 E4 G4 C5 E5|C4 D4 A4 D5 F5|B3 D4 G4 D5 F5|C4 E4 G4 C5 E5|C4 E4 A4 E5 A5|C4 D4 F#4 A4 D5|B3 D4 G4 D5 G5|B3 C4 E4 G4 C5|A3 C4 E4 G4 C5|D3 A3 D4 F#4 C5|G3 B3 D4 G4 B4|G3 Bb3 E4 G4 C#5|F3 A3 D4 A4 D5|F3 Ab3 D4 F4 B4|E3 G3 C4 G4 C5|E3 F3 A3 C4 F4|D3 F3 A3 C4 F4|G2 D3 G3 B3 F4|C3 E3 G3 C4 E4'.split('|').map(b=>{const n=b.split(' '),s=[0,1,2,3,4,2,3,4].map(i=>n[i]).join(' ');return s+' '+s}).join(' ')+' C3+G3+C4+E4+G4+C5:16';
const SW='F#5:6 B4 C#5 D5 E5 F#5:3 D5 F#5:3 D5 F#5:3 B4 D5 B4 G4 D5 B4:8',SB='B3+F#4:8 G3+D4:8 E3+B3:8 F#3+C#4:8 B3:2';
const MH='D5:2 G4 A4 B4 C5 D5:2 G4:2 G4:2 E5:2 C5 D5 E5 F#5 G5:2 G4:2 G4:2 C5:2 D5 C5 B4 A4 B4:2 C5 B4 A4 G4 ';
const S=[
{n:'致爱丽丝',c:'Beethoven · Für Elise',u:.19,v:['E5 D#5 E5 D#5 E5 B4 D5 C5 A4:2 R C4 E4 A4 B4:2 R E4 G#4 B4 C5:2 R E4 E5 D#5 E5 D#5 E5 B4 D5 C5 A4:2 R C4 E4 A4 B4:2 R E4 C5 B4 A4:4 R:2','R:8 A2 E3 A3 R:3 E2 E3 G#3 R:3 A2 E3 A3 R:9 A2 E3 A3 R:3 E2 E3 G#3 R:3 A2 E3 A3:4']},
{n:'勃拉姆斯摇篮曲',c:'Brahms · Wiegenlied',u:.27,tr:12,v:['E4 E4 G4:4 E4 E4 G4:4 E4 G4 C5:2 B4:3 A4 A4:2 G4:2 D4 E4 F4:2 D4:2 D4 E4 F4:4 D4 F4 B4 A4 G4:2 B4:2 C5:6','R:2 C3+G3:6 C3+G3:6 C3+E3:6 F3+C4:6 G3+B3:6 G3+D4:6 G3+F3:6 C3+E3:6']},
{n:'天鹅湖',c:'Tchaikovsky · Swan Lake',u:.3,v:[SW+' '+SW,SB+' '+SB]},
{n:'卡农',c:'Pachelbel · Canon in D',u:.3,v:['F#5:4 E5:4 D5:4 C#5:4 B4:4 A4:4 B4:4 C#5:4 D5:4 C#5:4 B4:4 A4:4 G4:4 F#4:4 G4:4 E4:4 D4 F#4 A4 G4 F#4 D4 F#4 E4 D4 B3 D4 A4 G4 B4 A4 G4 F#4 D4 E4 C#5 D5 F#5 A5 A4 B4 G4 A4 F#4 D4 D5 D5 C#5 D5+A4+F#4:8','*'+B1]},
{n:'吉姆诺佩迪 第一号',c:'Satie · Gymnopédie No.1',u:.62,v:['R:13 F#5 A5 G5 F#5 C#5 B4 C#5 D5 A4:9 R F#5 A5 G5 F#5 C#5 B4 C#5 D5 A4:3 F#4:12','*G2 B3+D4+F#4:2 D3 A3+C#4+F#4:2']},
{n:'C大调前奏曲',c:'J.S. Bach · BWV 846',u:.15,v:[PR]},
{n:'G大调小步舞曲',c:'Bach / Petzold · BWV Anh.114',u:.21,v:[MH+'F#4:2 G4 A4 B4 G4 A4:6 '+MH+'A4:2 B4 A4 G4 F#4 G4:6','G3+B3:6 B3:6 C4:6 B3:6 A3:6 G3:6 D4:2 B3:2 G3:2 F#3:6 G3+B3:6 B3:6 C4:6 B3:6 A3:6 G3:6 C4:2 D4:2 D3:2 G3:6']},
{n:'D小调托卡塔 (哥特)',c:'J.S. Bach · BWV 565',u:.095,v:['A5 G5 A5:10 R:2 G5 F5 E5 D5 C#5:6 D5:12 R:6 A4 G4 A4:10 R:2 E4:3 F4:3 C#4:6 D4:12 R:6 A3 G3 A3:10 R:2 G3 F3 E3 D3 C#3:6 D3:14 R:4 D3:2 C#4:2 E4:2 G4:2 Bb4:2 C#5+E5+G5:10 D4+F4+A4+D5+F5:24 R:8']}];
const NI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const mid=n=>{const r=/^([A-G])([#b]?)(\d)$/.exec(n);return 12*(+r[3]+1)+NI[r[1]]+(r[2]=='#'?1:r[2]=='b'?-1:0)};
function parse(s,tr,vi){let tt=0,ev=[];for(const k of s.trim().split(/\s+/)){const[n,d]=k.split(':'),du=d?+d:1;if(n!='R')ev.push({t:tt,m:n.split('+').map(q=>mid(q)+tr),v:vi?.75:1});tt+=du}return{ev,len:tt}}
S.forEach(so=>{const p=so.v.map((s,i)=>({lp:s[0]=='*',...parse(s.replace('*',''),so.tr||0,i)}));so.len=Math.max(...p.filter(q=>!q.lp).map(q=>q.len));let ev=[];
p.forEach(q=>{if(q.lp){for(let o=0;o<so.len;o+=q.len)q.ev.forEach(e=>{if(o+e.t<so.len)ev.push({...e,t:e.t+o})})}else ev.push(...q.ev)});so.ev=ev.sort((a,b)=>a.t-b.t)});
/* ---------- audio: music-box tine synthesis + cathedral reverb ---------- */
let AC,master,bus;
function initAudio(){if(AC)return;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
AC=new(window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(AC.destination);
master=AC.createGain();master.gain.value=.85;const rv=AC.createConvolver(),n=AC.sampleRate*3.4|0,ib=AC.createBuffer(2,n,AC.sampleRate);
for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}rv.buffer=ib;
const wet=AC.createGain();wet.gain.value=.42;master.connect(comp);master.connect(rv);rv.connect(wet);wet.connect(comp)}
function newBus(){if(bus){const b=bus;b.gain.setTargetAtTime(0,AC.currentTime,.12);setTimeout(()=>b.disconnect(),1500)}bus=AC.createGain();bus.connect(master)}
const PT=[[1,1,1],[2.003,.1,.42],[4.07,.07,.2],[6.27,.05,.09],[9.1,.035,.035]];
function pluck(m,w,v){const f=440*2**((m-69)/12),k=Math.min(2.6,Math.max(.55,Math.sqrt(523/f)*1.7));
for(const[r,a,dc]of PT){if(f*r>15000)continue;const o=AC.createOscillator(),g=AC.createGain(),e=w+dc*k*1.7+.05;o.frequency.value=f*r;o.detune.value=(Math.random()-.5)*7;
g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(a*v*.15,w+.002);g.gain.exponentialRampToValueAtTime(.0001,e);o.connect(g);g.connect(bus);o.start(w);o.stop(e+.05)}}
let cur=0,playing=false,st=0,pi=0,vis=[];
function sched(){if(!playing||!AC)return;const so=S[cur],u=so.u,now=AC.currentTime;
for(;;){if(pi>=so.ev.length){st+=so.len*u+1.8;pi=0}const e=so.ev[pi],w=st+e.t*u;if(w>now+.3)break;
if(w>now-.05){e.m.forEach(m=>pluck(m,w,e.v*(e.m.length>2?.7:1)));vis.push({w,m:e.m})}pi++}}
setInterval(sched,50);
function play(){initAudio();AC.resume();if(!bus)newBus();const so=S[cur];st=AC.currentTime+.08-(pi<so.ev.length?so.ev[pi].t:0)*so.u;playing=true;$('hint').style.opacity=0;ui()}
function pause(){playing=false;vis=[];if(AC)newBus();ui()}
function pick(i){cur=(i+S.length)%S.length;pi=0;vis=[];if(AC)newBus();play()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AC&&playing)AC.resume()});
/* ---------- drawing helpers ---------- */
function G(a,b){const g=x.createLinearGradient(0,a,0,b);g.addColorStop(0,'#fff3c0');g.addColorStop(.3,'#f2c75c');g.addColorStop(.65,'#a8741c');g.addColorStop(1,'#f0cf6e');return g}
function GH(a,b){const g=x.createLinearGradient(a,0,b,0);g.addColorStop(0,'#7a5212');g.addColorStop(.35,'#fff0b8');g.addColorStop(.6,'#d9a840');g.addColorStop(1,'#5c3a0a');return g}
function pearl(X,Y,r){const g=x.createRadialGradient(X-r*.35,Y-r*.35,r*.1,X,Y,r);g.addColorStop(0,'#fff');g.addColorStop(.6,'#f0e6ea');g.addColorStop(1,'#b8a8a8');x.fillStyle=g;x.beginPath();x.arc(X,Y,r,0,TAU);x.fill()}
function gem(X,Y,r,c='#c0123a'){const g=x.createRadialGradient(X-r*.3,Y-r*.3,r*.1,X,Y,r);g.addColorStop(0,'#ffb0c4');g.addColorStop(.5,c);g.addColorStop(1,'#3a0010');x.fillStyle=g;x.beginPath();x.ellipse(X,Y,r*.8,r,0,0,TAU);x.fill();x.strokeStyle='#e8c060';x.lineWidth=Math.max(1,r*.25);x.stroke()}
const RC=[['#f8c0cc','#c8506e'],['#fde8ec','#d896a8'],['#f0a0b8','#9a3050']];
function rose(X,Y,r,ci=0){const[c1,c2]=RC[ci%3];x.fillStyle='#6f9a5a';x.beginPath();x.ellipse(X-r*.9,Y+r*.3,r*.6,r*.28,-.5,0,TAU);x.ellipse(X+r*.9,Y+r*.35,r*.6,r*.28,.5,0,TAU);x.fill();
const g=x.createRadialGradient(X-r*.3,Y-r*.3,r*.1,X,Y,r);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.beginPath();x.arc(X,Y,r,0,TAU);x.fill();
x.strokeStyle='rgba(110,20,50,.45)';x.lineWidth=Math.max(.5,r*.12);for(let i=0;i<3;i++){x.beginPath();x.arc(X+(i-1)*r*.1,Y+(i%2)*r*.08,r*(.75-i*.22),i*1.7,i*1.7+3.8);x.stroke()}}
function curl(X,Y,s,d){x.beginPath();x.moveTo(X,Y);x.bezierCurveTo(X+s*d*.5,Y-s*.7,X+s*d*1.2,Y-s*.2,X+s*d*.9,Y+s*.25);x.arc(X+s*d*.68,Y+s*.18,s*.22,0,d>0?4.5:-4.5,d<0);x.stroke()}
function lancet(cx,top,w,h){const l=cx-w/2,r=cx+w/2;x.beginPath();x.moveTo(l,top+h);x.lineTo(l,top+w*.55);x.quadraticCurveTo(l,top+w*.05,cx,top-w*.08);x.quadraticCurveTo(r,top+w*.05,r,top+w*.55);x.lineTo(r,top+h);x.closePath()}
/* ---------- layout ---------- */
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=sc.width=W*D|0;cv.height=sc.height=H*D|0;
const bw=Math.min(W*.9,H*.56,560),y0=H*.6,bh=bw*.27,td=bw*.15,ww=Math.min(W*.22,H*.17),sp=Math.min(W*.33,ww*2.2),wt=H*.075,wh=Math.min(H*.45,y0-H*.1);
L={bw,bh,td,ti:bw*.05,lh:bw*.56,cx:W/2,y0,yb:y0+bh,x0:W/2-bw/2,x1:W/2+bw/2,yk:y0-td,ww,sp,wt,wh,wins:[-1,0,1].map(i=>W/2+i*sp),tb:y0+bh*.35,k:.42,
cyx:W/2+bw*.2,cyy:y0-td*.64,cl:bw*.27,cr:td*.19,pcx:W/2-bw*.2,pcy:y0-td*.55,pr:bw*.15,cand:[[W/2-sp*1.45,y0-bw*.05],[W/2+sp*1.45,y0-bw*.05]]};
beams=[];L.wins.forEach((wx,i)=>{for(let j=0;j<2;j++){const wy=wt+wh*(.35+j*.3);beams.push({u:wx-wy*L.k+(j-.5)*ww*.3,w:ww*(.2+j*.08),c:[[255,226,170],[200,170,255],[255,180,205],[170,210,255]][(i+j*2)%4],p:Math.random()*9})}});
dust=Array.from({length:Math.min(260,W*H/1400|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,v:Math.random()*.15+.03,p:Math.random()*9}));
x=sc.getContext('2d');x.setTransform(D,0,0,D,0,0);drawStatic();x=MX}
/* ---------- static layer: cathedral, table, box body ---------- */
function drawStatic(){const{bw,bh,td,ti,lh,cx,y0,yb,x0,x1,yk,ww,wt,wh,tb}=L;
let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c1018');g.addColorStop(.6,'#2a1a1c');g.addColorStop(1,'#120a0c');x.fillStyle=g;x.fillRect(0,0,W,H);
for(let i=-2;i<=1;i++){const px=cx+(i+.5)*L.sp,cw=ww*.32;g=x.createLinearGradient(px-cw/2,0,px+cw/2,0);g.addColorStop(0,'#1e1514');g.addColorStop(.5,'#5a4640');g.addColorStop(1,'#1e1514');x.fillStyle=g;x.fillRect(px-cw/2,0,cw,tb);
x.fillStyle='#3a2c28';x.fillRect(px-cw*.7,wt+wh*.5,cw*1.4,cw*.25);x.fillRect(px-cw*.7,tb-cw*.4,cw*1.4,cw*.4)}
L.wins.forEach((wx,wi)=>{const w=ww,top=wt,h=wh,cs=w/4.5;x.save();lancet(wx,top,w,h);x.clip();x.fillStyle='#140c22';x.fillRect(wx-w,top-w,w*2,h+w*2);
for(let j=0;j*cs/2<h+w;j++)for(let i=-1;i<6;i++){const X=wx-w/2+i*cs+(j%2)*cs/2,Y=top-w*.1+j*cs/2;x.fillStyle=GL[(i*3+j*5+wi*2+((i*j)%4))%7];x.globalAlpha=.5+.5*((i*31+j*17+wi*7)%5)/4;
x.beginPath();x.moveTo(X,Y-cs/2);x.lineTo(X+cs/2,Y);x.lineTo(X,Y+cs/2);x.lineTo(X-cs/2,Y);x.closePath();x.fill();x.globalAlpha=1;x.strokeStyle='rgba(12,6,10,.9)';x.lineWidth=1.2;x.stroke()}
if(wi==1){const R=w*.42,ry=top+w*.55;x.fillStyle='#140c22';x.beginPath();x.arc(wx,ry,R,0,TAU);x.fill();x.save();x.translate(wx,ry);
for(let i=0;i<12;i++){x.rotate(TAU/12);x.fillStyle=GL[i%7];x.beginPath();x.ellipse(0,-R*.58,R*.16,R*.34,0,0,TAU);x.fill();x.stroke();x.fillStyle=GL[(i+3)%7];x.beginPath();x.arc(0,-R*.9,R*.08,0,TAU);x.fill();x.stroke()}
x.fillStyle='#d4204e';x.beginPath();x.arc(0,0,R*.2,0,TAU);x.fill();x.stroke();x.restore();x.lineWidth=3;x.beginPath();x.arc(wx,ry,R,0,TAU);x.stroke()}
g=x.createRadialGradient(wx-w*.2,top+h*.3,0,wx,top+h*.4,h*.7);g.addColorStop(0,'rgba(255,245,220,.5)');g.addColorStop(1,'rgba(255,240,200,0)');x.globalCompositeOperation='lighter';x.fillStyle=g;x.fillRect(wx-w,top-w,w*2,h+w*2);x.globalCompositeOperation='source-over';
x.strokeStyle='rgba(12,6,10,.95)';x.lineWidth=2.5;x.beginPath();x.moveTo(wx,top+(wi==1?w*.98:0));x.lineTo(wx,top+h);for(let k=1;k<4;k++){x.moveTo(wx-w,top+h*k/4+w*.3);x.lineTo(wx+w,top+h*k/4+w*.3)}x.stroke();x.restore();
lancet(wx,top,w,h);x.strokeStyle='#4a3a34';x.lineWidth=w*.08;x.stroke();x.strokeStyle='#1a1210';x.lineWidth=w*.02;x.stroke()});
// table + runner
g=x.createLinearGradient(0,tb,0,H);g.addColorStop(0,'#7a5030');g.addColorStop(.12,'#40261a');g.addColorStop(1,'#1a0d08');x.fillStyle=g;x.fillRect(0,tb,W,H-tb);x.fillStyle=G(tb-3,tb+3);x.fillRect(0,tb-2,W,4);
const ry0=tb+bh*.1,rw0=bw*.62,rw1=bw*.95;x.beginPath();x.moveTo(cx-rw0,ry0);x.lineTo(cx+rw0,ry0);x.lineTo(cx+rw1,H);x.lineTo(cx-rw1,H);x.closePath();
g=x.createRadialGradient(cx,yb,bw*.1,cx,yb,bw);g.addColorStop(0,'#8a1430');g.addColorStop(1,'#34050f');x.fillStyle=g;x.fill();
x.strokeStyle='#d9a840';x.lineWidth=2;x.setLineDash([3,3]);x.beginPath();x.moveTo(cx-rw0+8,ry0+6);x.lineTo(cx+rw0-8,ry0+6);x.moveTo(cx-rw0+8,ry0+6);x.lineTo(cx-rw1+8,H);x.moveTo(cx+rw0-8,ry0+6);x.lineTo(cx+rw1-8,H);x.stroke();x.setLineDash([]);
x.strokeStyle='rgba(217,168,64,.35)';x.lineWidth=1.2;for(let i=0;i<10;i++){const X=cx+(i%5-2)*bw*.3,Y=yb+bh*.4+Math.floor(i/5)*bh*.9;curl(X,Y,bw*.05,1);curl(X,Y,bw*.05,-1)}
L.cand.forEach(([X,Y])=>{x.fillStyle=G(Y,tb);x.fillRect(X-bw*.008,Y+bw*.08,bw*.016,tb-Y-bw*.08);x.beginPath();x.ellipse(X,tb,bw*.04,bw*.012,0,0,TAU);x.fill();x.beginPath();x.ellipse(X,Y+bw*.08,bw*.03,bw*.008,0,0,TAU);x.fill();
