  /* =========================================================================
   * 8. 机械八音盒三维部件绘制函数（皇冠、立体双色玫瑰、描金瓷鼓、宝镜倒影、音筒音梳）
   * ========================================================================= */
  const teethVib = new Float32Array(28);
  let carouselAng = 0.25;
  let cylAng = 0;
  let autoSpd = 0;
  let spinBoost = 0;
  let userVel = 0;
  let musicPulse = 0;
  let crownBob = 0;
  let simTime = 0;

  function triggerVisualNotes(midiList) {
    musicPulse = 1.0;
    crownBob = 1.0;
    midiList.forEach(m => {
      const idx = Math.max(0, Math.min(27, Math.round(((m - 45) / 42) * 27)));
      teethVib[idx] = 1.0;
      const u = (idx + 0.5) / 28;
      const tipX = 684 + u * 102;
      const tipY = (OY + 373) + u * 16;
      spawnSparklesScene(tipX, tipY - 2, 1);
    });
    if (Math.random() < 0.65) {
      spawnSparklesScene(524 + (Math.random() - 0.5) * 86, OY + 220 + (Math.random() - 0.5) * 55, 2);
    }
  }

  function drawStarGlint(x, y, r, alpha, color = '#fff7dc', rot = 0) {
    if (alpha <= 0.02) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.fillStyle = color;
    ctx.beginPath();
    const w = r * 0.16;
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(w * 0.4, -w * 0.4, r, 0);
    ctx.quadraticCurveTo(w * 0.4, w * 0.4, 0, r);
    ctx.quadraticCurveTo(-w * 0.4, w * 0.4, -r, 0);
    ctx.quadraticCurveTo(-w * 0.4, -w * 0.4, 0, -r);
    ctx.fill();

    // 柔和中心珠晕
    ctx.globalAlpha = Math.min(1, alpha * 0.42);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.36, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawPearl3D(x, y, r, brightness = 1.0) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.38, r * 0.08, x, y, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.55, brightness > 0.85 ? '#f9ecee' : '#dccbcf');
    g.addColorStop(1, '#8c7276');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  function drawRuby3D(x, y, rx, ry) {
    const g = ctx.createRadialGradient(x - rx * 0.3, y - ry * 0.3, rx * 0.1, x, y, Math.max(rx, ry));
    g.addColorStop(0, '#ffc2d4');
    g.addColorStop(0.45, '#cb1646');
    g.addColorStop(1, '#3c0212');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#f2cc74';
    ctx.lineWidth = Math.max(0.8, rx * 0.28);
    ctx.stroke();
  }

  // 绘制复古油画级三维旋转皇家十字珍珠红宝石皇冠 (精确还原原画镂空古金、四瓣深红丝绒与大珠金拱)
  function drawRoyalCrown3D(cx, cyBase, scale, rotAng, isReflection = false) {
    ctx.save();
    ctx.translate(cx, cyBase);
    ctx.scale(scale, scale);

    const rx = 37;
    const ry = 6.6;
    const bandH = 16.5;
    const yRimTop = -bandH;
    const yApex = -43;

    // 冠座底部暗金阴影托盘
    ctx.fillStyle = '#2b1604';
    ctx.beginPath();
    ctx.ellipse(0, 0.5, rx * 0.98, ry * 0.98, 0, 0, TAU);
    ctx.fill();

    // 4 道巴洛克镶珍珠双金线皇冠拱 (双侧饱满外扩弧线，复刻原画皇家比例)
    const arches = [0, 1, 2, 3].map(k => {
      const a = rotAng + k * (Math.PI * 0.5);
      return { a, c: Math.cos(a), s: Math.sin(a) };
    });

    const renderArch = (o, isFront) => {
      const xStart = o.c * (rx * 0.96);
      const yStart = yRimTop + o.s * ry;
      const cpX1 = o.c * (rx * 1.28);
      const cpY1 = yRimTop - 22 + o.s * 2;
      const cpX2 = o.c * (rx * 0.55);
      const cpY2 = yApex - 6 + o.s * 1.5;
      const xEnd = 0;
      const yEnd = yApex + 3.5;

      // 古铜暗部底边（赋予厚重金属浮雕感）
      ctx.lineCap = 'round';
      ctx.strokeStyle = isFront ? '#3b2105' : '#261403';
      ctx.lineWidth = isFront ? 6.6 : 5.2;
      ctx.beginPath();
      ctx.moveTo(xStart, yStart);
      ctx.bezierCurveTo(cpX1, cpY1, cpX2, cpY2, xEnd, yEnd);
      ctx.stroke();

      // 24K 鎏金主拱带
      ctx.strokeStyle = isFront ? '#dfa63c' : '#8f6419';
      ctx.lineWidth = isFront ? 4.8 : 3.6;
      ctx.stroke();

      // 拱沿高光金丝
      ctx.strokeStyle = isFront ? '#fff0b2' : '#bb8e38';
      ctx.lineWidth = 1.3;
      ctx.stroke();

      // 拱脊密镶复古珍珠串
      if (!isReflection) {
        const steps = 7;
        for (let i = 1; i <= steps; i++) {
          const t = i / (steps + 0.5);
          const it = 1 - t;
          const px = it*it*it*xStart + 3*it*it*t*cpX1 + 3*it*t*t*cpX2 + t*t*t*xEnd;
          const py = it*it*it*yStart + 3*it*it*t*cpY1 + 3*it*t*t*cpY2 + t*t*t*yEnd;
          const pr = (2.45 - t * 0.55) * (isFront ? 1.05 : 0.82);
          ctx.fillStyle = 'rgba(42, 20, 4, 0.75)';
          ctx.beginPath();
          ctx.arc(px, py + 0.6, pr * 1.08, 0, TAU);
          ctx.fill();
          drawPearl3D(px, py, pr, isFront ? 1.0 : 0.72);
        }
      }
    };

    // 1) 后排金拱与后排百合花冠齿
    arches.filter(o => o.s < 0).forEach(o => renderArch(o, false));

    for (let k = 0; k < 12; k++) {
      const a = rotAng + k * (TAU / 12);
      const s = Math.sin(a);
      if (s < 0) {
        const gx = Math.cos(a) * rx * 0.94;
        const gy = yRimTop + s * ry;
        ctx.fillStyle = '#785114';
        ctx.beginPath();
        ctx.moveTo(gx - 2.5, gy);
        ctx.lineTo(gx, gy - 5.5);
        ctx.lineTo(gx + 2.5, gy);
        ctx.closePath();
        ctx.fill();
      }
    }

    // 2) 四瓣深酒红天鹅绒内衬冠帽（压低饱满度，带真实丝绒暗褶）
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-rx * 0.90, yRimTop + 1);
    ctx.bezierCurveTo(-rx * 1.02, yRimTop - 21, -rx * 0.35, yApex + 1, 0, yApex + 4);
    ctx.bezierCurveTo(rx * 0.35, yApex + 1, rx * 1.02, yRimTop - 21, rx * 0.90, yRimTop + 1);
    ctx.ellipse(0, yRimTop + 1, rx * 0.90, ry * 0.85, 0, 0, Math.PI);
    ctx.closePath();

    const velGrad = ctx.createRadialGradient(-rx * 0.32, yRimTop - 13, 2, 0, yRimTop - 8, rx * 1.02);
    velGrad.addColorStop(0, '#b5183c');
    velGrad.addColorStop(0.42, '#68071d');
    velGrad.addColorStop(0.82, '#2d020b');
    velGrad.addColorStop(1, '#180106');
    ctx.fillStyle = velGrad;
    ctx.fill();

    // 随角度旋转的丝绒凹褶暗影与柔光瓣
    ctx.clip();
    arches.forEach(o => {
      const fx = o.c * rx * 0.82;
      ctx.strokeStyle = 'rgba(15, 0, 5, 0.58)';
      ctx.lineWidth = 4.2;
      ctx.beginPath();
      ctx.moveTo(fx, yRimTop + 4);
      ctx.quadraticCurveTo(fx * 0.65, yRimTop - 16, 0, yApex + 4);
      ctx.stroke();

      const lobeA = o.a + Math.PI * 0.25;
      if (Math.sin(lobeA) > -0.2) {
        const lx = Math.cos(lobeA) * rx * 0.56;
        const lg = ctx.createRadialGradient(lx, yRimTop - 11, 1, lx, yRimTop - 10, 12);
        lg.addColorStop(0, 'rgba(235, 62, 102, 0.28)');
        lg.addColorStop(1, 'rgba(180, 20, 55, 0)');
        ctx.fillStyle = lg;
        ctx.fillRect(lx - 13, yRimTop - 24, 26, 26);
      }
    });
    ctx.restore();

    // 3) 巴洛克浮雕镂空古金冠座圈
    const bandGrad = ctx.createLinearGradient(-rx, 0, rx, 0);
    bandGrad.addColorStop(0, '#3e2405');
    bandGrad.addColorStop(0.18, '#b98425');
    bandGrad.addColorStop(0.34, '#ffefad');
    bandGrad.addColorStop(0.56, '#cf962e');
    bandGrad.addColorStop(0.82, '#7d5210');
    bandGrad.addColorStop(1, '#331c04');
    ctx.fillStyle = bandGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI);
    ctx.lineTo(-rx, yRimTop);
    ctx.ellipse(0, yRimTop, rx, ry, 0, Math.PI, 0, true);
    ctx.closePath();
    ctx.fill();

    // 冠圈内嵌深古铜雕花暗槽纹理，彻底消除扁平矢量感
    ctx.strokeStyle = 'rgba(52, 26, 4, 0.62)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(0, -bandH * 0.22, rx * 0.99, ry * 0.98, 0, 0, Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -bandH * 0.78, rx * 0.99, ry * 0.98, 0, 0, Math.PI);
    ctx.stroke();

    // 上下镶珠滚边金线
    ctx.strokeStyle = '#fce39c';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, yRimTop, rx, ry, 0, 0, Math.PI);
    ctx.stroke();

    // 冠座环绕红宝石、珍珠与三叶鸢尾花金冠尖
    for (let k = 0; k < 12; k++) {
      const a = rotAng + k * (TAU / 12);
      const s = Math.sin(a);
      const c = Math.cos(a);
      if (s >= -0.05) {
        const gx = c * rx * 0.96;
        const gyRim = yRimTop + s * ry;
        const gyMid = -bandH * 0.5 + s * ry;

        // 巴洛克鸢尾花立尖 + 尖端微珠
        ctx.fillStyle = '#3b2104';
        ctx.beginPath();
        ctx.moveTo(gx - 3.3, gyRim + 0.5);
        ctx.lineTo(gx, gyRim - 6.8);
        ctx.lineTo(gx + 3.3, gyRim + 0.5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = s > 0.35 ? '#ffecaa' : '#be8a2a';
        ctx.beginPath();
        ctx.moveTo(gx - 2.6, gyRim + 0.4);
        ctx.lineTo(gx, gyRim - 6.0);
        ctx.lineTo(gx + 2.6, gyRim + 0.4);
        ctx.closePath();
        ctx.fill();

        if (!isReflection) {
          drawPearl3D(gx, gyRim - 6.2, 1.35 * (0.7 + 0.3 * s), 0.95);
          // 冠带雕花暗托 + 宝石交替镶嵌
          ctx.fillStyle = 'rgba(42, 18, 4, 0.75)';
          ctx.beginPath();
          ctx.arc(gx, gyMid, 3.1 * (0.65 + 0.35 * s), 0, TAU);
          ctx.fill();
          if (k % 2 === 0) drawRuby3D(gx, gyMid, 2.2 * (0.65 + 0.35 * s), 2.8);
          else drawPearl3D(gx, gyMid, 2.0 * (0.65 + 0.35 * s), 1.0);
        }
      }
    }

    // 4) 前排珍珠金拱
    arches.filter(o => o.s >= 0).sort((a, b) => a.s - b.s).forEach(o => renderArch(o, true));

    // 5) 顶部宝球与巴洛克外扩十字架 (Cross Pattée)
    const orbY = yApex + 1;
    ctx.fillStyle = '#361d04';
    ctx.beginPath();
    ctx.arc(0, orbY + 0.6, 5.8, 0, TAU);
    ctx.fill();

    const orbG = ctx.createRadialGradient(-2, orbY - 2, 0.5, 0, orbY, 5.6);
    orbG.addColorStop(0, '#fff8d4');
    orbG.addColorStop(0.52, '#dfa83c');
    orbG.addColorStop(1, '#68410a');
    ctx.fillStyle = orbG;
    ctx.beginPath();
    ctx.arc(0, orbY, 5.2, 0, TAU);
    ctx.fill();
    if (!isReflection) drawRuby3D(0, orbY, 2.1, 2.1);

    // 立体透视巴洛克十字架
    const crossSpan = Math.max(2.4, Math.abs(Math.cos(rotAng)) * 9.6);
    const sideShift = Math.sin(rotAng) * 1.5;
    const cyCross = orbY - 13.5;

    const drawCrossShape = (dx, fillCol) => {
      ctx.fillStyle = fillCol;
      ctx.beginPath();
      // 竖臂（上下外扩喇叭口）
      ctx.moveTo(-2.8 + dx, cyCross - 8.5);
      ctx.lineTo(2.8 + dx, cyCross - 8.5);
      ctx.lineTo(1.5 + dx, cyCross);
      ctx.lineTo(2.6 + dx, orbY - 4.5);
      ctx.lineTo(-2.6 + dx, orbY - 4.5);
      ctx.lineTo(-1.5 + dx, cyCross);
      ctx.closePath();
      ctx.fill();
      // 横臂（随三维转角透视伸缩）
      ctx.beginPath();
      ctx.moveTo(-crossSpan + dx, cyCross - 2.6);
      ctx.lineTo(crossSpan + dx, cyCross - 2.6);
      ctx.lineTo(crossSpan + dx, cyCross + 2.6);
      ctx.lineTo(-crossSpan + dx, cyCross + 2.6);
      ctx.closePath();
      ctx.fill();
    };

    drawCrossShape(sideShift, '#4f2f06');
    drawCrossShape(0, '#f4ca64');
    ctx.fillStyle = '#fff5c8';
    ctx.fillRect(-1.1, cyCross - 7.5, 2.2, 11.5);
    ctx.fillRect(-crossSpan * 0.85, cyCross - 1.1, crossSpan * 1.7, 2.2);

    if (!isReflection) {
      drawRuby3D(0, cyCross, 1.8, 1.8);
      drawPearl3D(0, cyCross - 9.2, 1.4, 1.0);
      if (crossSpan > 4.5) {
        drawPearl3D(-crossSpan - 0.8, cyCross, 1.3, 0.95);
        drawPearl3D(crossSpan + 0.8, cyCross, 1.3, 0.95);
      }
    }

    ctx.restore();
  }

  // 绘制盒盖椭圆宝镜中的旋转皇冠倒影与彩绘花窗流光
  function drawMirrorReflection() {
    const mx = 735;
    const my = OY + 175;
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(-0.05);
    ctx.beginPath();
    ctx.ellipse(0, 0, 66, 44, 0, 0, TAU);
    ctx.clip();
    ctx.rotate(0.05);
    ctx.translate(-mx, -my);

    // 镜内花窗微光浮动
    ctx.globalCompositeOperation = 'lighter';
    const shimmer = 0.08 + 0.04 * Math.sin(simTime * 0.9) + musicPulse * 0.03;
    const mg = ctx.createRadialGradient(766 + Math.sin(simTime * 0.5) * 6, OY + 172, 4, 766, OY + 172, 48);
    mg.addColorStop(0, `rgba(255, 195, 225, ${shimmer})`);
    mg.addColorStop(0.6, `rgba(165, 195, 255, ${shimmer * 0.65})`);
    mg.addColorStop(1, 'rgba(255, 220, 190, 0)');
    ctx.fillStyle = mg;
    ctx.fillRect(665, OY + 125, 145, 105);

    // 镜中皇冠倒影（反向旋转 + 柔雾镜面质感）
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.54;
    const bobY = Math.sin(simTime * 2.4) * 1.2 - crownBob * 1.4;
    drawRoyalCrown3D(709, OY + 225 + bobY * 0.65, 0.58, -carouselAng * 0.9 + 0.5, true);

    // 镜面斜向柔光掠影
    ctx.globalCompositeOperation = 'lighter';
    const sweep = ((simTime * 0.08) % 2.4) - 0.7;
    const sx = 675 + sweep * 110;
    const sg = ctx.createLinearGradient(sx - 24, OY + 130, sx + 24, OY + 220);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, 'rgba(255,248,235,0.12)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(665, OY + 125, 145, 105);

    ctx.restore();
  }

  // 绘制右侧黄铜音筒滚动音钉与 28 齿银色音梳实时拨动
  function drawCylinderAndComb() {
    const xL = 696, yL = OY + 354;
    const xR = 806, yR = OY + 371;
    const tilt = Math.atan2(yR - yL, xR - xL); // +0.153 rad
    const cylLen = Math.hypot(xR - xL, yR - yL);
    const cylR = 15.8;

    // 1) 左侧黄铜传动齿轮旋转高光
    ctx.save();
    ctx.translate(687, OY + 353);
    ctx.rotate(tilt);
    ctx.strokeStyle = 'rgba(255, 240, 175, 0.52)';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 9; i++) {
      const ga = cylAng * 2.4 + i * (TAU / 9);
      const sy = Math.sin(ga) * 14.5;
      if (Math.cos(ga) > 0) {
        ctx.beginPath();
        ctx.moveTo(-3.5, sy);
        ctx.lineTo(2.5, sy);
        ctx.stroke();
      }
    }
    ctx.restore();

    // 2) 黄铜音筒表面滚动音钉与金属高光带
    ctx.save();
    ctx.translate(xL, yL);
    ctx.rotate(tilt);

    // 动态金属呼吸光泽
    const sheenG = ctx.createLinearGradient(0, -cylR, 0, cylR);
    sheenG.addColorStop(0, 'rgba(110, 72, 16, 0.18)');
    sheenG.addColorStop(0.34, `rgba(255, 246, 198, ${0.22 + 0.08 * Math.sin(cylAng * 4)})`);
    sheenG.addColorStop(0.7, 'rgba(215, 162, 58, 0.12)');
    sheenG.addColorStop(1, 'rgba(60, 36, 8, 0.25)');
    ctx.fillStyle = sheenG;
    ctx.fillRect(0, -cylR, cylLen, cylR * 2);

    // 110 颗立体黄铜音钉随音筒向下滚动拨弦
    for (let i = 0; i < CYL_PINS.length; i++) {
      const p = CYL_PINS[i];
      const a = p.ang + cylAng * 1.9;
      const vis = Math.cos(a);
      if (vis > 0.08) {
        const px = p.u * cylLen;
        const py = Math.sin(a) * (cylR * 0.92);
        // 背光小暗影
        ctx.fillStyle = `rgba(58, 34, 6, ${0.55 * vis})`;
        ctx.fillRect(px - 0.8, py + 0.7, 1.9, 1.7);
        // 24K 金钉尖高光
        ctx.fillStyle = `rgba(255, 248, 208, ${0.88 * vis})`;
        ctx.fillRect(px - 0.9, py - 0.8, 1.7, 1.5);
      }
    }
    ctx.restore();

    // 3) 28 齿银色钢片音梳：对齐原画精确斜向透视，音符触发时高频震颤与流光闪耀
    for (let i = 0; i < 28; i++) {
      const vib = teethVib[i];
      const u = (i + 0.5) / 28;
      const jitter = vib > 0.02 ? Math.sin(simTime * (92 + i * 2.7)) * vib * 1.35 : 0;
      const tipX = 684 + u * 102 + jitter;
      const tipY = (OY + 373) + u * 16 - vib * 1.1;
      const rootX = 656 + u * 107;
      const rootY = (OY + 402) + u * 14;

      if (vib > 0.025) {
        ctx.strokeStyle = `rgba(255, 246, 214, ${Math.min(0.95, 0.25 + vib * 0.85)})`;
        ctx.lineWidth = 2.1;
        ctx.beginPath();
        ctx.moveTo(rootX, rootY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();

        // 钢片尖端晶莹亮点
        ctx.fillStyle = `rgba(255, 250, 225, ${vib * 0.9})`;
        ctx.beginPath();
        ctx.arc(tipX, tipY, 1.6 + vib * 1.2, 0, TAU);
        ctx.fill();
      } else {
        // 静态微弱银钢光泽，与原画音梳浑然一体
        ctx.strokeStyle = 'rgba(226, 234, 246, 0.16)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(rootX, rootY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
      }
    }
  }

  // 绘制左侧三层立体巴洛克皇冠鎏金玫瑰转台
  function drawBaroqueCarousel() {
    const cx = 524;
    const platterY = OY + 347;
    const drumRx = 96;
    const drumRy = 17.2;
    const drumH = 26;
    const drumTopY = platterY - drumH;
    const bobOffset = Math.sin(simTime * 2.3) * 1.4 * Math.min(1, Math.abs(totalOmega()) * 0.9) - crownBob * 1.8;

    // 0) 底部拉丝黄铜底盘旋转流光与柔和接触阴影
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const platGlow = ctx.createRadialGradient(cx - 28, platterY - 3, 6, cx, platterY, 115);
    platGlow.addColorStop(0, `rgba(255, 224, 152, ${0.11 + 0.05 * Math.sin(carouselAng * 2)})`);
    platGlow.addColorStop(1, 'rgba(255, 200, 110, 0)');
    ctx.fillStyle = platGlow;
    ctx.beginPath();
    ctx.ellipse(cx, platterY, 118, 21, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(14, 4, 8, 0.55)';
    ctx.beginPath();
    ctx.ellipse(cx, platterY + 3.5, drumRx * 1.04, drumRy * 1.08, 0, 0, TAU);
    ctx.fill();

    // 1) 第一层：三维连续切变曲面贴图描金粉玫红宝石瓷鼓底座 (64 片切线斜切投影，零锯齿丝滑曲面)
    if (imgs.band) {
      const slices = 64;
      const bw = imgs.band.width;
      const bh = imgs.band.height;
      for (let i = 0; i < slices; i++) {
        const phi0 = -Math.PI * 0.5 + (i / slices) * Math.PI;
        const phi1 = -Math.PI * 0.5 + ((i + 1) / slices) * Math.PI;
        const phiMid = (phi0 + phi1) * 0.5;

        const x0 = cx + Math.sin(phi0) * drumRx;
        const x1 = cx + Math.sin(phi1) * drumRx;
        const dx = x1 - x0;
        if (dx <= 0.08) continue;

        const y0 = drumTopY + Math.cos(phi0) * drumRy;
        const y1 = drumTopY + Math.cos(phi1) * drumRy;
        const shearY = (y1 - y0) / dx;
        const wSlice = dx + 0.55;

        let uTex = ((phiMid - carouselAng * 1.0) / TAU) * 2.0;
        uTex = ((uTex % 1) + 1) % 1;
        const sx = Math.min(bw - 4, uTex * (bw - 4));

        ctx.save();
        ctx.transform(1, shearY, 0, 1, x0, y0);
        ctx.drawImage(imgs.band, sx, 0, 4, bh, 0, 0, wSlice, drumH);

        // 复古暖金釉色融合 + 圆柱立体光影渐变，与原画巴洛克古董瓷色调完全统一
        const lightVal = Math.cos(phiMid + 0.52);
        const shadeAlpha = 0.14 + Math.max(0, 0.55 - lightVal * 0.55) * 0.58;
        ctx.fillStyle = `rgba(42, 14, 10, ${shadeAlpha})`;
        ctx.fillRect(0, 0, wSlice, drumH);
        if (lightVal > 0.78) {
          ctx.fillStyle = `rgba(255, 238, 192, ${(lightVal - 0.78) * 0.36})`;
          ctx.fillRect(0, 0, wSlice, drumH);
        }
        ctx.restore();
      }
    }

    // 瓷鼓上下 24K 鎏金箍圈
    const rimGrad = ctx.createLinearGradient(cx - drumRx, 0, cx + drumRx, 0);
    rimGrad.addColorStop(0, '#6e4910');
    rimGrad.addColorStop(0.3, '#fff3c4');
    rimGrad.addColorStop(0.6, '#dfa940');
    rimGrad.addColorStop(1, '#583708');
    ctx.strokeStyle = rimGrad;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.ellipse(cx, platterY, drumRx, drumRy, 0, 0, Math.PI);
    ctx.stroke();

    // 瓷鼓顶盘底衬与手绘粉玫瓷盘俯视旋转面
    ctx.fillStyle = rimGrad;
    ctx.beginPath();
    ctx.ellipse(cx, drumTopY, drumRx, drumRy, 0, 0, TAU);
    ctx.fill();

    // 12 根鎏金珍珠栏杆立柱（先画后排 sin < 0）
    const posts = Array.from({ length: 12 }, (_, k) => {
      const a = carouselAng + k * (TAU / 12);
      return { a, c: Math.cos(a), s: Math.sin(a) };
    });
    const renderPost = (p, front) => {
      const px = cx + p.c * (drumRx * 0.96);
      const py = drumTopY + p.s * (drumRy * 0.96);
      const postH = 12.5;
      ctx.strokeStyle = front ? '#fbe094' : '#a87822';
      ctx.lineWidth = front ? 2.2 : 1.7;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px, py - postH);
      ctx.stroke();
      drawPearl3D(px, py - postH - 1.6, front ? 2.3 : 1.8, front ? 1.0 : 0.75);
    };
    posts.filter(p => p.s < 0).forEach(p => renderPost(p, false));

    // 内层抬升描金粉红玫瑰瓷盘顶面（真实贴图椭圆透视旋转）
    const discY = drumTopY - 5;
    const discRx = 74;
    const discRy = 13.4;
    ctx.fillStyle = '#8b5e16';
    ctx.beginPath();
    ctx.ellipse(cx, discY + 2.5, discRx + 2, discRy + 1.2, 0, 0, TAU);
    ctx.fill();

    if (imgs.disc) {
      ctx.save();
      ctx.translate(cx, discY);
      ctx.scale(1, discRy / discRx);
      ctx.beginPath();
      ctx.arc(0, 0, discRx, 0, TAU);
      ctx.clip();
      ctx.rotate(carouselAng);
      ctx.drawImage(imgs.disc, -discRx, -discRx, discRx * 2, discRx * 2);
      ctx.rotate(-carouselAng);
      const dg = ctx.createLinearGradient(-discRx, -discRx, discRx, discRx);
      dg.addColorStop(0, 'rgba(255, 228, 180, 0.08)');
      dg.addColorStop(0.55, 'rgba(65, 22, 18, 0.14)');
      dg.addColorStop(1, 'rgba(38, 10, 12, 0.30)');
      ctx.fillStyle = dg;
      ctx.fillRect(-discRx, -discRx, discRx * 2, discRx * 2);
      ctx.restore();
    }
    ctx.strokeStyle = rimGrad;
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.ellipse(cx, discY, discRx, discRy, 0, 0, TAU);
    ctx.stroke();

    // 前排鎏金珍珠栏杆立柱与上圈金栏横梁
    ctx.strokeStyle = 'rgba(252, 224, 146, 0.72)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.ellipse(cx, drumTopY - 9.5, drumRx * 0.96, drumRy * 0.96, 0, 0, Math.PI);
    ctx.stroke();
    posts.filter(p => p.s >= 0).sort((a, b) => a.s - b.s).forEach(p => renderPost(p, true));

    // 2) 第二层：中心车削鎏金立柱 + 6 簇立体双色玫瑰花环 (真实 RGBA 雕塑玫瑰三维环绕)
    const hubY = OY + 260 + bobOffset;
    const crownSeatY = OY + 224 + bobOffset * 0.85;
    const roseOrbitRx = 64;
    const roseOrbitRy = 14.5;

    const roses = Array.from({ length: 6 }, (_, i) => {
      const a = -carouselAng * 1.05 + i * (TAU / 6);
      return { i, a, c: Math.cos(a), s: Math.sin(a) };
    });

    const renderRoseCluster = (rObj) => {
      const spImg = rObj.i % 2 === 0 ? imgs.r1 : imgs.r2;
      if (!spImg) return;
      const rxPos = cx + rObj.c * roseOrbitRx;
      const ryPos = hubY + rObj.s * roseOrbitRy;
      const depthScale = 0.82 + 0.20 * ((rObj.s + 1) * 0.5);

      // 连接中心转轴的巴洛克弧形鎏金花枝
      ctx.strokeStyle = rObj.s >= 0 ? '#f4c968' : '#8f651c';
      ctx.lineWidth = rObj.s >= 0 ? 2.6 : 2.0;
      ctx.beginPath();
      ctx.moveTo(cx, hubY + 5);
      ctx.quadraticCurveTo((cx + rxPos) * 0.5, hubY + 10 + rObj.s * 4, rxPos, ryPos + 3);
      ctx.stroke();

      const baseW = (rObj.i % 2 === 0 ? 68 : 60) * depthScale;
      const baseH = baseW * (spImg.height / spImg.width);

      ctx.save();
      ctx.translate(rxPos, ryPos);
      // 随圆周位置轻微自然倾侧，左侧朝外、右侧朝外，富有立体雕塑感
      if (rObj.c > 0.15 && rObj.i % 2 === 0) ctx.scale(-1, 1);
      ctx.rotate(rObj.c * 0.06);
      if (rObj.s < 0) ctx.globalAlpha = 0.88;
      ctx.drawImage(spImg, -baseW * 0.5, -baseH * 0.54, baseW, baseH);

      // 当玫瑰转至左侧圣光区时泛起温暖柔光，在后方阴影区则微微沉暗
      if (rObj.s < -0.15) {
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = `rgba(38, 6, 16, ${(-rObj.s) * 0.28})`;
        ctx.fillRect(-baseW * 0.5, -baseH * 0.54, baseW, baseH);
      }
      ctx.restore();
    };

    // 先绘制转至立柱后方的玫瑰簇
    roses.filter(r => r.s < 0).sort((a, b) => a.s - b.s).forEach(renderRoseCluster);

    // 中心 24K 车削鎏金立柱与多层圆盘轴套
    const drawSpindleSegment = (yTop, yBot, wHalf) => {
      const sg = ctx.createLinearGradient(cx - wHalf, 0, cx + wHalf, 0);
      sg.addColorStop(0, '#5e3c08');
      sg.addColorStop(0.32, '#fff4c6');
      sg.addColorStop(0.62, '#d8a238');
      sg.addColorStop(1, '#4d3006');
      ctx.fillStyle = sg;
      ctx.fillRect(cx - wHalf, yTop, wHalf * 2, yBot - yTop);

      // 旋转螺旋金纹高光
      ctx.strokeStyle = 'rgba(255, 250, 220, 0.65)';
      ctx.lineWidth = 1.0;
      for (let k = 0; k < 5; k++) {
        const u = ((k / 5) + (carouselAng / TAU)) % 1;
        const sy = yTop + u * (yBot - yTop);
        ctx.beginPath();
        ctx.moveTo(cx - wHalf, sy);
        ctx.lineTo(cx + wHalf, sy - 2.2);
        ctx.stroke();
      }
    };

    // 底座轴托
    ctx.fillStyle = rimGrad;
    ctx.beginPath();
    ctx.ellipse(cx, discY - 1, 16, 3.6, 0, 0, TAU);
    ctx.fill();
    drawSpindleSegment(hubY + 4, discY - 1, 6.2);

    // 玫瑰花环中心鎏金莲座
    ctx.fillStyle = rimGrad;
    ctx.beginPath();
    ctx.ellipse(cx, hubY + 5, 19, 4.2, 0, 0, TAU);
    ctx.fill();
    drawSpindleSegment(crownSeatY, hubY + 4, 5.0);

    // 再绘制转至立柱前方的玫瑰簇
    roses.filter(r => r.s >= 0).sort((a, b) => a.s - b.s).forEach(renderRoseCluster);

    // 旋转速度充沛时浮现原画同款丝绸流光残影环
    const speedMag = Math.min(1.5, Math.abs(totalOmega()));
    if (speedMag > 0.08) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) {
        const a0 = carouselAng * 1.8 + k * 2.1;
        ctx.strokeStyle = k % 2 === 0
          ? `rgba(255, 236, 205, ${0.13 * speedMag})`
          : `rgba(255, 196, 218, ${0.10 * speedMag})`;
        ctx.lineWidth = 1.6 - k * 0.3;
        ctx.beginPath();
        ctx.ellipse(cx, hubY + 18 - k * 9, roseOrbitRx * 1.42 + k * 6, (roseOrbitRx * 1.42 + k * 6) * 0.17, 0, a0, a0 + 1.55);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 3) 第三层：顶部皇家十字珍珠红宝石皇冠
    drawRoyalCrown3D(cx, crownSeatY, 1.05, carouselAng * 0.85, false);

    // 当皇冠十字正对花窗圣光时绽放钻石星芒
    const crownGlint = Math.pow(Math.max(0, Math.cos(carouselAng * 0.85 - 0.55)), 10);
    if (crownGlint > 0.05) {
      drawStarGlint(cx, crownSeatY - 66, 13 * crownGlint, crownGlint * 0.85, '#fff8de', simTime * 0.4);
    }
  }

  // 绘制螺钿贝母盒身流光、右侧古堡烛火摇曳、彩绘圣光束与悬浮金粉
  function drawCathedralLightAndParticles(dt) {
    const li = lightIntensity;

    // 1) 右侧古堡双烛台真实烛火摇曳 (x=978, y=OY+204 & x=993, y=OY+191)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    [[978, OY + 201, 0], [993, OY + 188, 2.2]].forEach(([fx, fy, ph]) => {
      const flick = 0.86 + 0.14 * Math.sin(simTime * 11.5 + ph) + 0.08 * Math.cos(simTime * 19.3 + ph);
      const hg = ctx.createRadialGradient(fx, fy - 4, 1, fx, fy - 4, 46 * flick);
      hg.addColorStop(0, `rgba(255, 212, 128, ${0.42 * li})`);
      hg.addColorStop(0.5, `rgba(255, 148, 62, ${0.14 * li})`);
      hg.addColorStop(1, 'rgba(255, 120, 40, 0)');
      ctx.fillStyle = hg;
      ctx.fillRect(fx - 50, fy - 54, 100, 100);

      ctx.fillStyle = '#fff4c8';
      ctx.beginPath();
      ctx.ellipse(fx + Math.sin(simTime * 8 + ph) * 0.9, fy - 5 * flick, 2.3, 6.2 * flick, 0, 0, TAU);
      ctx.fill();
    });

    // 2) 哥特玫瑰花窗呼吸圣光晕
    const winGlows = [
      [215, 88, 175, [255, 220, 168], 0.11],
      [168, 620, 150, [255, 185, 220], 0.10],
      [172, OY + 68, 165, [255, 210, 175], 0.12],
      [175, OY + 215, 145, [190, 185, 255], 0.09]
    ];
    winGlows.forEach(([wx, wy, wr, [r, g, b], baseA], idx) => {
      const a = (baseA + 0.035 * Math.sin(simTime * 0.75 + idx * 1.7) + musicPulse * 0.035) * li;
      const wg = ctx.createRadialGradient(wx, wy, 4, wx, wy, wr);
      wg.addColorStop(0, `rgba(${r},${g},${b},${a})`);
      wg.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = wg;
      ctx.fillRect(wx - wr, wy - wr, wr * 2, wr * 2);
    });

    // 3) 斜射丁达尔彩绘圣光束（随微风与乐句轻柔摆动呼吸）
    SUNBEAMS.forEach((bm, idx) => {
      const sway = Math.sin(simTime * 0.28 + bm.ph) * 18;
      const a = (bm.alpha * (0.78 + 0.28 * Math.sin(simTime * 0.55 + bm.ph)) + musicPulse * 0.022) * li;
      const [r, g, b] = bm.col;
      const xTop = bm.x0 + sway * 0.4;
      const xBot = bm.x0 + (bm.y1 - bm.y0) * bm.slope + sway;

      const bg = ctx.createLinearGradient(xTop, bm.y0, xBot, bm.y1);
      bg.addColorStop(0, `rgba(${r},${g},${b},0)`);
      bg.addColorStop(0.16, `rgba(${r},${g},${b},${a})`);
      bg.addColorStop(0.68, `rgba(${r},${g},${b},${a * 0.62})`);
      bg.addColorStop(1, `rgba(${r},${g},${b},0)`);

      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(xTop - bm.w0, bm.y0);
      ctx.lineTo(xTop + bm.w0, bm.y0);
      ctx.lineTo(xBot + bm.w1, bm.y1);
      ctx.lineTo(xBot - bm.w1, bm.y1);
      ctx.closePath();
      ctx.fill();

      // 桌面与石砖地面琉璃彩光流转斑
      if (idx >= 2) {
        const ty = OY + 435 + (idx % 3) * 58;
        const tx = bm.x0 + (ty - bm.y0) * bm.slope * 0.42 + sway * 0.7;
        ctx.fillStyle = `rgba(${r},${g},${b},${0.075 * li * (0.7 + 0.3 * Math.sin(simTime * 0.9 + idx))})`;
        ctx.beginPath();
        ctx.ellipse(tx, ty, 58, 15, -0.08, 0, TAU);
        ctx.fill();
      }
    });

    // 4) 盒身正面螺钿贝母幻彩虹光流淌
    ctx.save();
    ctx.beginPath();
    // 严格裁剪在左右两块螺钿贝母镶嵌面板内
    ctx.moveTo(302, OY + 392); ctx.lineTo(440, OY + 412); ctx.lineTo(432, OY + 502); ctx.lineTo(304, OY + 476); ctx.closePath();
    ctx.moveTo(582, OY + 425); ctx.lineTo(762, OY + 446); ctx.lineTo(754, OY + 556); ctx.lineTo(580, OY + 520); ctx.closePath();
    ctx.clip();

    const nacrePos = 260 + ((simTime * 42) % 620);
    const ng = ctx.createLinearGradient(nacrePos - 95, OY + 390, nacrePos + 95, OY + 555);
    ng.addColorStop(0, 'rgba(255,255,255,0)');
    ng.addColorStop(0.35, `rgba(255, 182, 232, ${0.15 * li})`);
    ng.addColorStop(0.65, `rgba(168, 232, 255, ${0.17 * li})`);
    ng.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = ng;
    ctx.fillRect(290, OY + 385, 490, 180);
    ctx.restore();

    // 5) 宝石与珍珠呼吸星芒
    JEWEL_GLINTS.forEach(jg => {
      const tw = Math.pow(Math.max(0, Math.sin(simTime * 1.15 + jg.ph)), 6) * li;
      if (tw > 0.04) {
        drawStarGlint(jg.x, jg.y, jg.s * (0.7 + 0.4 * tw), tw * 0.72, jg.col, 0.25);
      }
    });

    // 6) 三层景深悬浮圣堂金粉微尘（穿过丁达尔光束时自然璀璨点亮）
    for (let i = 0; i < DUST_MOTES.length; i++) {
      const d = DUST_MOTES[i];
      d.y -= d.vy * (0.7 + 0.5 * Math.abs(totalOmega())) * (dt * 60);
      d.x += (d.vx + Math.sin(simTime * 0.65 + d.ph) * 0.22) * (dt * 60);
      if (d.y < -15) { d.y = SH_SCENE + 10; d.x = Math.random() * SW_SCENE; }
      if (d.x < -10) d.x = SW_SCENE + 10;
      if (d.x > SW_SCENE + 10) d.x = -10;

      // 计算微尘是否处于圣光束内部
      let beamBoost = 0.14;
      for (let bIdx = 0; bIdx < SUNBEAMS.length; bIdx++) {
        const bm = SUNBEAMS[bIdx];
        if (d.y > bm.y0 && d.y < bm.y1) {
          const u = (d.y - bm.y0) / (bm.y1 - bm.y0);
          const bx = bm.x0 + (d.y - bm.y0) * bm.slope;
          const bw = bm.w0 + (bm.w1 - bm.w0) * u;
          const dist = Math.abs(d.x - bx) / bw;
          if (dist < 1) beamBoost += (1 - dist) * 0.78;
        }
      }

      const twinkle = 0.52 + 0.48 * Math.sin(simTime * 2.1 + d.ph);
      const alpha = Math.min(0.95, beamBoost * twinkle * li * (d.layer === 2 ? 0.32 : 0.85));
      if (alpha < 0.025) continue;

      ctx.globalAlpha = alpha;
      ctx.fillStyle = d.hue;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r * (1 + beamBoost * 0.28), 0, TAU);
      ctx.fill();
    }

    // 7) 音梳与指尖绽放的四芒音符星尘
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.life -= s.decay * dt;
      if (s.life <= 0) {
        sparkles.splice(i, 1);
        continue;
      }
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= Math.pow(0.45, dt);
      s.vy -= 8 * dt; // 轻盈上浮
      drawStarGlint(s.x, s.y, s.size * (0.55 + 0.45 * s.life), s.life * 0.95, s.col, simTime * 1.8 + i);
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* =========================================================================
   * 9. 主渲染循环 (120Hz ProMotion 丝滑物理阻尼)
   * ========================================================================= */
  let lastFrameNow = performance.now();

  function totalOmega() {
    return autoSpd * effectiveRate() + spinBoost + userVel;
  }

  function renderFrame(now) {
    requestAnimationFrame(renderFrame);
    const dt = Math.min(0.05, Math.max(0.001, (now - lastFrameNow) / 1000));
    lastFrameNow = now;
    simTime += dt;

    // 同步触发到达播放时刻的音梳拨弦动画
    if (AC && playing) {
      const ct = AC.currentTime;
      while (visualNoteQueue.length && visualNoteQueue[0].w <= ct + 0.008) {
        triggerVisualNotes(visualNoteQueue.shift().m);
      }
    }

    // 真实发条储能消耗
    if (playing && realisticSpringMode) {
      springEnergy = Math.max(0, springEnergy - dt * 0.0072);
    }

    // 相机平滑阻尼过渡
    const camEase = 1 - Math.pow(0.0008, dt);
    cam.sc += (camTarget.sc - cam.sc) * camEase;
    cam.ox += (camTarget.ox - cam.ox) * camEase;
    cam.oy += (camTarget.oy - cam.oy) * camEase;

    // 转盘角速度惯性与衰减
    const targetAuto = playing ? 1.0 : 0.0;
    autoSpd += (targetAuto - autoSpd) * (1 - Math.pow(0.04, dt));
    spinBoost *= Math.pow(0.22, dt);
    if (!pointerState.draggingCarousel) {
      userVel *= Math.pow(0.14, dt);
    }

    const omega = totalOmega();
    carouselAng += omega * dt * 1.18;
    cylAng += omega * dt * 0.72;
    musicPulse *= Math.pow(0.06, dt);
    crownBob *= Math.pow(0.025, dt);
    for (let i = 0; i < 28; i++) teethVib[i] *= Math.pow(0.0025, dt);

    // 更新进度条与发条状态读数
    updateProgressHUD();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0d0508';
    ctx.fillRect(0, 0, W, H);

    if (!assetsReady || !imgs.master) return;

    // 若屏幕超宽或处于原图横幅模式，先铺一层柔焦哥特花窗氛围背景消除黑边
    if (cam.ox > 1 || cam.oy > 1 || cam.ox + SW_SCENE * cam.sc < W - 1 || cam.oy + SH_SCENE * cam.sc < H - 1) {
      ctx.save();
      ctx.globalAlpha = 0.42;
      const bgSc = Math.max(W / SW_SCENE, H / SH_SCENE) * 1.06;
      ctx.drawImage(
        imgs.master,
        (W - SW_SCENE * bgSc) * 0.5,
        (H - SH_SCENE * bgSc) * 0.5,
        SW_SCENE * bgSc,
        SH_SCENE * bgSc
      );
      ctx.fillStyle = 'rgba(12, 4, 8, 0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 进入 1024x1835 统一母版场景空间
    ctx.save();
    ctx.translate(cam.ox, cam.oy);
    ctx.scale(cam.sc, cam.sc);

    // 层 1: 原画无缝母版底图
    ctx.drawImage(imgs.master, 0, 0, SW_SCENE, SH_SCENE);

    // 层 2: 盒盖椭圆宝镜中的同步皇冠倒影与花窗流光
    drawMirrorReflection();

    // 层 3: 右侧黄铜音筒滚动音钉与 28 齿银色音梳拨弦
    drawCylinderAndComb();

    // 层 4: 左侧三层立体巴洛克皇冠与双色玫瑰转台
    drawBaroqueCarousel();

    // 层 5: 前沿珍珠鎏金盒沿真实三维前景遮罩（让音梳根部与底盘严丝合缝藏于盒内）
    ctx.drawImage(fgRimCanvas, fgX0, fgY0);

    // 层 6: 哥特花窗丁达尔圣光束、螺钿贝母幻彩、烛火与三层景深悬浮金粉星尘
    drawCathedralLightAndParticles(dt);

    ctx.restore();
  }

  /* =========================================================================
   * 10. 触控交互：指尖拨动皇冠玫瑰亲手转音 + 点触星尘 + 双击沉浸全屏
   * ========================================================================= */
  const pointerState = {
    active: false,
    id: -1,
    startX: 0,
    startY: 0,
    lastX: 0,
    lastY: 0,
    moved: false,
    draggingCarousel: false,
    scrubAccum: 0,
    lastTapTime: 0
  };

  function isInsideCarouselZone(sx, sy) {
    return sx >= 365 && sx <= 685 && sy >= OY + 125 && sy <= OY + 390;
  }
  function isInsideMusicBox(sx, sy) {
    return sx >= 285 && sx <= 925 && sy >= OY + 25 && sy <= OY + 600;
  }

  cv.addEventListener('pointerdown', e => {
    if (closeOpenDrawers()) return;
    ensureAudio();
    pointerState.active = true;
    pointerState.id = e.pointerId;
    pointerState.startX = pointerState.lastX = e.clientX;
    pointerState.startY = pointerState.lastY = e.clientY;
    pointerState.moved = false;
    pointerState.scrubAccum = 0;

    const sp = screenToScene(e.clientX, e.clientY);
    pointerState.draggingCarousel = isInsideCarouselZone(sp.x, sp.y);
    spawnSparklesScene(sp.x, sp.y, 4);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });

  cv.addEventListener('pointermove', e => {
    if (!pointerState.active || e.pointerId !== pointerState.id) return;
    const dx = e.clientX - pointerState.lastX;
    const dy = e.clientY - pointerState.lastY;
    pointerState.lastX = e.clientX;
    pointerState.lastY = e.clientY;

    if (Math.hypot(e.clientX - pointerState.startX, e.clientY - pointerState.startY) > 7) {
      pointerState.moved = true;
    }

    const sp = screenToScene(e.clientX, e.clientY);
    if (pointerState.draggingCarousel) {
      // 指尖直接拨动皇冠玫瑰转盘：赋予真实旋转惯性并随手速拨响清脆八音盒音符！
      const dAng = (dx / Math.max(90, 140 * cam.sc)) * 1.45;
      carouselAng += dAng;
      cylAng += dAng * 0.62;
      userVel = Math.max(-4.5, Math.min(4.5, dAng * 26));
      springEnergy = Math.min(1.0, springEnergy + Math.abs(dAng) * 0.04);
      document.getElementById('whisperHint').classList.add('hidden');

      pointerState.scrubAccum += Math.abs(dAng);
      if (pointerState.scrubAccum > 0.24 && AC) {
        pointerState.scrubAccum = 0;
        const so = SONGS[curSongIdx];
        if (so.ev.length) {
          const ev = so.ev[eventPtr % so.ev.length];
          eventPtr = (eventPtr + 1) % so.ev.length;
          songBeatPos = ev.t;
          const now = AC.currentTime + 0.005;
          ev.m.forEach((m, idx) => pluckNote(m, now + idx * 0.012, ev.v * 0.85));
          triggerVisualNotes(ev.m);
        }
      }
    } else if (pointerState.moved && Math.random() < 0.45) {
      spawnSparklesScene(sp.x, sp.y, 1);
    }
  });

  function endPointer(e) {
    if (!pointerState.active || e.pointerId !== pointerState.id) return;
    pointerState.active = false;

    if (!pointerState.moved) {
      const now = performance.now();
      const sp = screenToScene(e.clientX, e.clientY);
      // 双击空白处切换纯净沉浸赏玩模式
      if (now - pointerState.lastTapTime < 290 && !isInsideMusicBox(sp.x, sp.y)) {
        document.body.classList.toggle('immersive');
        pointerState.lastTapTime = 0;
        return;
      }
      pointerState.lastTapTime = now;

      if (document.body.classList.contains('immersive')) {
        document.body.classList.remove('immersive');
        return;
      }

      if (isInsideMusicBox(sp.x, sp.y)) {
        if (playing) pausePlayback();
        else {
          playRatchetClick(1.05);
          spinBoost += 0.65;
          startPlayback();
        }
      } else {
        // 轻点彩绘圣光空白区：漾开星尘并轻响一颗高音水晶泛音
        ensureAudio();
        if (AC && songBus) {
          const pentatonic = [74, 76, 79, 81, 83, 86];
          const note = pentatonic[(Math.random() * pentatonic.length) | 0];
          pluckNote(note, AC.currentTime + 0.005, 0.48);
        }
        spawnSparklesScene(sp.x, sp.y, 7);
        if (!playing) startPlayback();
      }
    }
    pointerState.draggingCarousel = false;
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);

  /* =========================================================================
   * 11. 界面控件绑定与曲目分类抽屉
   * ========================================================================= */
  const playlistSheet = document.getElementById('playlistSheet');
  const tuningSheet = document.getElementById('tuningSheet');
  const songListScroll = document.getElementById('songListScroll');
  const tuneBtn = document.getElementById('tuneBtn');
  const listBtn = document.getElementById('listBtn');
  let activeCategory = 'all';

  function closeOpenDrawers() {
    let closed = false;
    if (playlistSheet.classList.contains('open')) {
      playlistSheet.classList.remove('open');
      closed = true;
    }
    if (tuningSheet.classList.contains('open')) {
      tuningSheet.classList.remove('open');
      tuneBtn.dataset.active = 'false';
      closed = true;
    }
    return closed;
  }

  function renderSongList() {
    songListScroll.innerHTML = SONGS.map((so, idx) => {
      if (activeCategory !== 'all' && so.cat !== activeCategory) return '';
      const isCur = idx === curSongIdx;
      return `
        <div class="song-item${isCur ? ' active' : ''}" data-idx="${idx}">
          <div class="song-item-left">
            <div class="song-item-title">
              <span>${isCur && playing ? '♪ ' : ''}${so.n}</span>
            </div>
            <div class="song-item-sub">${so.c}</div>
          </div>
          <span class="song-item-badge">${so.tag}</span>
        </div>`;
    }).join('');
  }

  function updateUI() {
    const so = SONGS[curSongIdx];
    document.getElementById('trackTag').textContent = so.tag;
    document.getElementById('trackTitle').textContent = so.n;
    document.getElementById('trackComposer').textContent = so.c;
    document.getElementById('playBtn').innerHTML = playing
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.8" height="14" rx="1"/><rect x="13.7" y="5" width="3.8" height="14" rx="1"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.4 5.2v13.6L19.4 12 8.4 5.2z"/></svg>';
    renderSongList();
  }

  function updateProgressHUD() {
    const so = SONGS[curSongIdx];
    const pct = Math.max(0, Math.min(100, (songBeatPos / Math.max(1, so.len)) * 100));
    document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';

    const readout = document.getElementById('springReadout');
    if (realisticSpringMode) {
      readout.textContent = `发条余量 ${Math.round(springEnergy * 100)}%`;
    } else {
      readout.textContent = playing ? '八音盒奏鸣中 · 可拨动皇冠' : '轻触八音盒或点击播放';
    }
  }

  document.getElementById('playBtn').addEventListener('click', e => {
    e.stopPropagation();
    if (playing) pausePlayback();
    else {
      playRatchetClick(1.0);
      spinBoost += 0.55;
      startPlayback();
    }
  });
  document.getElementById('prevBtn').addEventListener('click', e => {
    e.stopPropagation();
    selectSong(curSongIdx - 1);
  });
  document.getElementById('nextBtn').addEventListener('click', e => {
    e.stopPropagation();
    selectSong(curSongIdx + 1);
  });

  const togglePlaylist = e => {
    e.stopPropagation();
    tuningSheet.classList.remove('open');
    tuneBtn.dataset.active = 'false';
    playlistSheet.classList.toggle('open');
  };
  listBtn.addEventListener('click', togglePlaylist);
  document.getElementById('trackMetaBtn').addEventListener('click', togglePlaylist);

  tuneBtn.addEventListener('click', e => {
    e.stopPropagation();
    playlistSheet.classList.remove('open');
    const isOpen = tuningSheet.classList.toggle('open');
    tuneBtn.dataset.active = isOpen ? 'true' : 'false';
  });

  document.getElementById('windBtn').addEventListener('click', e => {
    e.stopPropagation();
    windUpSpring();
  });

  // 顶部铭牌一键在“哥特全景”与“机芯特写”之间优雅推拉镜头
  document.getElementById('zoomQuickBtn').addEventListener('click', e => {
    e.stopPropagation();
    viewMode = viewMode === 'closeup' ? 'auto' : 'closeup';
    document.querySelectorAll('#viewModeGroup .mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.view === viewMode);
    });
    updateCameraTarget(false);
  });

  document.getElementById('filterTabs').addEventListener('click', e => {
    const btn = e.target.closest('.filter-tab');
    if (!btn) return;
    activeCategory = btn.dataset.cat;
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.toggle('active', b === btn));
    renderSongList();
  });

  songListScroll.addEventListener('click', e => {
    const item = e.target.closest('.song-item');
    if (!item) return;
    selectSong(+item.dataset.idx);
    playlistSheet.classList.remove('open');
  });

  document.getElementById('viewModeGroup').addEventListener('click', e => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    viewMode = btn.dataset.view;
    document.querySelectorAll('#viewModeGroup .mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    updateCameraTarget(false);
  });

  document.getElementById('reverbSlider').addEventListener('input', e => {
    reverbAmount = (+e.target.value) / 100;
    document.getElementById('reverbVal').textContent = e.target.value + '%';
    updateReverbMix();
  });

  document.getElementById('lightSlider').addEventListener('input', e => {
    lightIntensity = (+e.target.value) / 100;
    document.getElementById('lightVal').textContent = e.target.value + '%';
  });

  document.getElementById('tempoSlider').addEventListener('input', e => {
    tempoUser = (+e.target.value) / 100;
    document.getElementById('tempoVal').textContent = tempoUser.toFixed(2) + '×';
  });

  const springModeBtn = document.getElementById('springModeBtn');
  springModeBtn.addEventListener('click', () => {
    realisticSpringMode = !realisticSpringMode;
    if (realisticSpringMode && springEnergy < 0.25) springEnergy = 1.0;
    springModeBtn.textContent = realisticSpringMode ? '真实发条渐慢' : '自动续弦';
    springModeBtn.classList.toggle('on', realisticSpringMode);
    updateProgressHUD();
  });

  resize();
  updateUI();
  setTimeout(() => document.getElementById('whisperHint').classList.add('hidden'), 11000);
  requestAnimationFrame(renderFrame);
})();
</script>
</body>
</html>
